<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice the EMT-CT &amp; MOCT Medical/Trauma question bank: 346 questions, mock tests, topic practice and instant answers.">
<meta name="theme-color" content="#0d1b26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EMT Bank">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>EMT Question Bank · Practice &amp; Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e5c63'/%3E%3Cpath d='M4 17h5l2-6 3 12 3-9 2 3h9' fill='none' stroke='%237ff0d2' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#e9eef3; --surface:#ffffff; --surface-2:#f4f7fa; --ink:#0b1a24; --ink-soft:#3d5464;
  --muted:#6b8090; --line:#d8e1e9; --line-strong:#c2d0db;
  --brand:#0e5c63; --brand-soft:#e2f1f1; --brand-ink:#0a4248;
  --alert:#c62f36; --alert-soft:#fdeaea;
  --ok:#0f7a45; --ok-soft:#e4f4ea;
  --amber:#b7791f; --amber-soft:#fdf3e0;
  --trace:#0e9e8f;
  --shadow:0 1px 2px rgba(11,26,36,.06),0 6px 18px -8px rgba(11,26,36,.18);
  --shadow-lg:0 10px 40px -12px rgba(11,26,36,.32);
  --r:14px; --r-lg:20px;
  --maxw:760px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Space Grotesk","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080f15; --surface:#101a22; --surface-2:#16232c; --ink:#e8f0f5; --ink-soft:#b3c4d0;
  --muted:#8299a8; --line:#22323d; --line-strong:#2e4351;
  --brand:#2fb3ac; --brand-soft:#102b2c; --brand-ink:#7fe6dd;
  --alert:#ff6b6b; --alert-soft:#2c1416;
  --ok:#3fd08a; --ok-soft:#0d2a1d;
  --amber:#f0b45e; --amber-soft:#2a2013;
  --trace:#38d6bd;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 16px 50px -16px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
input[type="search"]::-webkit-search-cancel-button,input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;display:none}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word; min-height:100vh; min-height:100dvh;
}
button,input,select,textarea{font:inherit;color:inherit}
button,[role="switch"],a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
::selection{background:var(--brand);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.app-main{padding-bottom:96px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.hide{display:none !important}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
}
@supports not (backdrop-filter:blur(4px)){.topbar{background:var(--surface)}}
.topbar-inner{max-width:var(--maxw);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.brandmark{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:17px}
.brandmark svg{display:block}
.tb-title{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}

.iconbtn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  transition:background .15s,color .15s,border-color .15s,transform .1s;flex:none;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}
.iconbtn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line)}
.hero-inner{max-width:var(--maxw);margin:0 auto;padding:30px 16px 22px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);font-weight:600}
h1.title{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.03;margin:10px 0 6px;font-size:clamp(30px,8.4vw,44px)}
.lede{color:var(--ink-soft);margin:0;font-size:15.5px;max-width:52ch}
.ecgband{display:block;width:100%;height:56px;margin-top:14px;opacity:.9}
.ecgband path{fill:none;stroke:var(--trace);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ecgband .lead{stroke-dasharray:1400;stroke-dashoffset:1400;animation:sweep 5.5s linear infinite}
.ecgband .ghost{stroke:var(--line-strong);stroke-width:1.5;opacity:.7}
@keyframes sweep{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ecgband .lead{animation:none;stroke-dashoffset:0}}

/* ---------- cards & buttons ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.section-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.section-h h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.02em;margin:0}
.section-h .count{font-family:var(--mono);font-size:12px;color:var(--muted)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 18px;border-radius:12px;font-weight:600;font-size:15px;
  border:1px solid transparent;transition:transform .1s,filter .15s,background .15s,border-color .15s;
  text-align:center;min-height:48px;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
html[data-theme="dark"] .btn-primary{color:#04191b}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{background:var(--alert-soft);color:var(--alert);border-color:color-mix(in srgb,var(--alert) 30%,transparent)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- home tiles ---------- */
.startcard{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;
  text-align:left;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);transition:transform .12s,border-color .15s,background .15s;
}
.startcard:hover{border-color:var(--line-strong);background:var(--surface-2)}
.startcard:active{transform:scale(.99)}
.startcard.primary{background:var(--brand);border-color:var(--brand)}
.startcard.primary .sc-name,.startcard.primary .sc-desc,.startcard.primary .chev{color:#fff}
html[data-theme="dark"] .startcard.primary .sc-name,html[data-theme="dark"] .startcard.primary .sc-desc,html[data-theme="dark"] .startcard.primary .chev{color:#052224}
.startcard.primary .sc-desc{opacity:.85}
.sc-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.startcard.primary .sc-ic{background:rgba(255,255,255,.18);color:#fff}
html[data-theme="dark"] .startcard.primary .sc-ic{background:rgba(0,0,0,.18);color:#052224}
.sc-name{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em;display:block}
.sc-desc{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.chev{color:var(--muted);flex:none}

/* ---------- progress ring ---------- */
.statcard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--brand);transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.minigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.mini .n{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em;display:block}
.mini .l{font-size:11.5px;color:var(--muted);letter-spacing:.02em;display:block;margin-top:1px}
.mini .n.ok{color:var(--ok)} .mini .n.bad{color:var(--alert)} .mini .n.amber{color:var(--amber)}

/* ---------- list rows ---------- */
.listrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:background .15s,border-color .15s;
}
.listrow+.listrow{margin-top:8px}
.listrow:hover{background:var(--surface-2);border-color:var(--line-strong)}
.lr-name{font-weight:600;font-size:15px}
.lr-sub{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.bar>span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.bar>span.ok{background:var(--ok)} .bar>span.bad{background:var(--alert)} .bar>span.amber{background:var(--amber)}

/* ---------- runner ---------- */
.qprogress{height:4px;background:var(--line);position:relative;overflow:hidden}
.qprogress>span{position:absolute;inset:0 auto 0 0;background:var(--brand);transition:width .35s cubic-bezier(.2,.7,.2,1)}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 10px}
.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-weight:500;
}
.chip.brand{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
html[data-theme="dark"] .chip.brand{color:var(--brand-ink)}
.ctxbox{
  border-left:3px solid var(--brand);background:var(--surface);border-radius:0 14px 14px 0;
  padding:14px 16px;font-size:14.5px;color:var(--ink-soft);border-top:1px solid var(--line);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px;
}
.ctxbox h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:0 0 6px}
.ctxbox p{margin:0}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(19px,4.6vw,23px);line-height:1.32;letter-spacing:-.02em;margin:6px 0 18px}
.qimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:0 0 16px;background:#fff}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);
  font-size:15.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover:not(.locked){border-color:var(--brand);background:var(--surface-2)}
.opt:active:not(.locked){transform:scale(.995)}
.opt .key{
  width:29px;height:29px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-weight:600;font-size:13.5px;background:var(--surface-2);
  color:var(--ink-soft);border:1px solid var(--line);margin-top:1px;
}
.opt .mark{flex:none;margin-top:3px;opacity:0;transition:opacity .15s}
.opt.chosen{border-color:var(--brand);background:var(--brand-soft)}
.opt.chosen .key{background:var(--brand);color:#fff;border-color:var(--brand)}
html[data-theme="dark"] .opt.chosen .key{color:#052224}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.correct .mark{opacity:1;color:var(--ok)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.wrong .key{background:var(--alert);color:#fff;border-color:var(--alert)}
.opt.wrong .mark{opacity:1;color:var(--alert)}
.opt.locked{cursor:default}
.opt.dim{opacity:.62}

.verdict{
  display:flex;gap:11px;align-items:flex-start;padding:14px 15px;border-radius:14px;margin-top:14px;
  border:1px solid var(--line);background:var(--surface-2);font-size:14.5px;
  animation:pop .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.verdict{animation:none}}
.verdict.good{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.verdict.bad{background:var(--alert-soft);border-color:color-mix(in srgb,var(--alert) 32%,transparent)}
.verdict b{font-family:var(--display);letter-spacing:-.01em}
.verdict .vtxt{flex:1}
.verdict .src{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px;display:block}

/* sticky bottom bar */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
@supports not (backdrop-filter:blur(4px)){.actionbar{background:var(--surface)}}
.actionbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;align-items:center}
.timer{font-family:var(--mono);font-weight:600;font-size:15px;padding:8px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);letter-spacing:.02em}
.timer.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.timer.crit{background:var(--alert-soft);border-color:var(--alert);color:var(--alert);animation:blink 1.1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.timer.crit{animation:none}}

/* nav grid sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(6,16,22,.55);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.sheet h3{font-family:var(--display);margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.sheet p{margin:0 0 16px;color:var(--ink-soft);font-size:14.5px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-bottom:16px}
.navcell{
  aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:13px;font-weight:500;display:grid;place-items:center;position:relative;
}
.navcell:hover{border-color:var(--brand)}
.navcell.answered{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink);font-weight:600}
.navcell.correct{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.navcell.wrong{background:var(--alert-soft);border-color:color-mix(in srgb,var(--alert) 40%,transparent);color:var(--alert)}
.navcell.current{outline:2.5px solid var(--brand);outline-offset:1px}
.navcell.flagged::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:99px;background:var(--amber)}

/* ---------- results ---------- */
.scorehead{text-align:center;padding:26px 18px}
.scorebig{font-family:var(--display);font-weight:700;font-size:clamp(46px,14vw,68px);line-height:1;letter-spacing:-.04em}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;font-weight:600;font-size:13.5px;margin-top:12px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.badge.pass{background:var(--ok-soft);color:var(--ok)}
.badge.fail{background:var(--alert-soft);color:var(--alert)}

/* ---------- browse ---------- */
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{
  width:100%;padding:13px 40px 13px 40px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none;
}
.searchwrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.searchwrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{
  flex:none;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;
}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-theme="dark"] .fchip[aria-pressed="true"]{color:#052224}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.qcard .qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qcard .qn{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;flex:none;padding-top:2px}
.qcard .qq{font-weight:600;font-size:15.5px;line-height:1.42;letter-spacing:-.01em}
.qcard ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qcard li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14.5px;padding:9px 11px;border-radius:10px;background:var(--surface-2);color:var(--ink-soft);line-height:1.42}
.qcard li.is-ans{background:var(--ok-soft);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent)}
.qcard li .k{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--muted)}
.qcard li.is-ans .k{color:var(--ok)}
.qcard .qfoot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.qcard .ctxmini{font-size:13.5px;color:var(--ink-soft);background:var(--surface-2);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:10px}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{margin-bottom:14px;color:var(--line-strong)}
.empty h3{font-family:var(--display);color:var(--ink);margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 18px;font-size:14.5px}

/* settings */
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .st{font-weight:600;font-size:15px}
.setrow .ss{font-size:13px;color:var(--muted);margin-top:2px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

en.", "It is more difficult to create a good mask seal in an infant.", "The glottic opening is smaller in an infant."], "ans": 2, "cat": "Airway, Breathing & Oxygen", "page": 1}, {"id": "A7", "set": "A", "num": 7, "q": "What does the T in DCAP-BTLS stand for?", "opts": ["tenderness", "time", "tourniquet", "trauma"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 1}, {"id": "A8", "set": "A", "num": 8, "q": "Distended neck veins, diminishing unilateral breath sounds, and progressively worsening compliance are indications of which of the following?", "opts": ["esophageal intubation", "endobronchial intubation", "tension pneumothorax", "hemopneumothorax"], "ans": 2, "cat": "Airway, Breathing & Oxygen", "page": 2}, {"id": "A9", "set": "A", "num": 9, "q": "When suctioning a patient, you should always perform which of the following?", "opts": ["Begin suctioning after the catheter is placed in the airway.", "Limit suctioning attempts to no more than 45 seconds each.", "Hyperventilate the patient after every three suction attempts.", "Insert the catheter while the suctioning apparatus is turned on."], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 2}, {"id": "A10", "set": "A", "num": 10, "q": "Which of the following can complicate ventilation in a pediatric patient?", "opts": ["hyperextension of the neck", "use of an oropharyngeal airway in unconscious patients", "a bag-valve mask without a pop-off valve", "ventilatory pressure that is higher than is used for adults"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 2}, {"id": "A11", "set": "A", "num": 11, "q": "What would account for the patient’s level of consciousness?", "opts": ["She has a drug overdose resulting in unconsciousness.", "She has heat stroke", "She is suffering from carbon monoxide poisoning.", "She is suffering from carbon dioxide poisoning."], "ans": 2, "cat": "Diabetic, Allergy & Medical", "page": 2, "ctx": "Answer questions 11–15 based on the following information. You respond along with fire units to the scene of a structure fire. Firefighters have rescued a 25-year-old female who is unconscious and unresponsive to verbal or painful stimuli. The victim was located in a smoke-filled bedroom on the floor above the actual fire. Vital signs are blood pressure 146/80 mmHg; pulse 128 BPM, strong and regular; and respiratory rate 40 breaths per minute. The ECG monitor shows sinus tachycardia. Auscultation reveals generally clear lung sounds and mild expiratory wheezing. You note no burn injuries to the skin or clothing."}, {"id": "A12", "set": "A", "num": 12, "q": "Which of the following is the reason why pulse oximetry readings should be scrutinized?", "opts": ["Elevated carbon monoxide levels can cause an inaccurately high reading of the percentage of oxygen saturation.", "Elevated carbon monoxide levels can cause an inaccurately low reading of the percentage of oxygen saturation.", "Elevated carbon dioxide levels can cause an inaccurately high reading of the percentage of oxygen saturation.", "Elevated carbon dioxide levels can cause an inaccurately low reading of the percentage of oxygen saturation."], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 2, "ctx": "Answer questions 11–15 based on the following information. You respond along with fire units to the scene of a structure fire. Firefighters have rescued a 25-year-old female who is unconscious and unresponsive to verbal or painful stimuli. The victim was located in a smoke-filled bedroom on the floor above the actual fire. Vital signs are blood pressure 146/80 mmHg; pulse 128 BPM, strong and regular; and respiratory rate 40 breaths per minute. The ECG monitor shows sinus tachycardia. Auscultation reveals generally clear lung sounds and mild expiratory wheezing. You note no burn injuries to the skin or clothing."}, {"id": "A13", "set": "A", "num": 13, "q": "Treatment for carbon monoxide poisoning should include which of the following?", "opts": ["nasal cannula (low-flow) oxygen", "IV drip of sodium bicarbonate", "transport to a hyperbaric facility", "transport in position of comfort"], "ans": 2, "cat": "Diabetic, Allergy & Medical", "page": 3, "ctx": "Answer questions 11–15 based on the following information. You respond along with fire units to the scene of a structure fire. Firefighters have rescued a 25-year-old female who is unconscious and unresponsive to verbal or painful stimuli. The victim was located in a smoke-filled bedroom on the floor above the actual fire. Vital signs are blood pressure 146/80 mmHg; pulse 128 BPM, strong and regular; and respiratory rate 40 breaths per minute. The ECG monitor shows sinus tachycardia. Auscultation reveals generally clear lung sounds and mild expiratory wheezing. You note no burn injuries to the skin or clothing."}, {"id": "A14", "set": "A", "num": 14, "q": "Signs of CO exposure include all EXCEPT which one of the following?", "opts": ["cyanotic skin", "cherry-red skin", "chest pain", "hyperactivity"], "ans": 3, "cat": "Cardiac & Circulation", "page": 3, "ctx": "Answer questions 11–15 based on the following information. You respond along with fire units to the scene of a structure fire. Firefighters have rescued a 25-year-old female who is unconscious and unresponsive to verbal or painful stimuli. The victim was located in a smoke-filled bedroom on the floor above the actual fire. Vital signs are blood pressure 146/80 mmHg; pulse 128 BPM, strong and regular; and respiratory rate 40 breaths per minute. The ECG monitor shows sinus tachycardia. Auscultation reveals generally clear lung sounds and mild expiratory wheezing. You note no burn injuries to the skin or clothing."}, {"id": "A15", "set": "A", "num": 15, "q": "Which of the following is a common source of CO?", "opts": ["engine exhaust", "cellular respiration", "cellular metabolism", "well-ventilated space heaters"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 3, "ctx": "Answer questions 11–15 based on the following information. You respond along with fire units to the scene of a structure fire. Firefighters have rescued a 25-year-old female who is unconscious and unresponsive to verbal or painful stimuli. The victim was located in a smoke-filled bedroom on the floor above the actual fire. Vital signs are blood pressure 146/80 mmHg; pulse 128 BPM, strong and regular; and respiratory rate 40 breaths per minute. The ECG monitor shows sinus tachycardia. Auscultation reveals generally clear lung sounds and mild expiratory wheezing. You note no burn injuries to the skin or clothing."}, {"id": "A16", "set": "A", "num": 16, "q": "You have just started an IV, but the fluid is not flowing properly. What is the first thing you should do to troubleshoot this situation?", "opts": ["Remove the cannula and try another site.", "Make sure the constricting band has been removed.", "Ensure that the right-size drip set is attached.", "Lower the IV bag below the level of the patient’s arm."], "ans": 1, "cat": "IV Therapy & Fluids", "page": 3}, {"id": "A17", "set": "A", "num": 17, "q": "How should you position the patient to check for jugular vein distention?", "opts": ["lying flat on the patient’s back", "sitting upright near 90°", "standing up in anatomical position", "elevated at a 45° angle"], "ans": 3, "cat": "Cardiac & Circulation", "page": 3}, {"id": "A18", "set": "A", "num": 18, "q": "The pain of stable angina is brought on by which of the following?", "opts": ["exercise or stress", "imminent AMI", "difficulty breathing", "overuse of nitroglycerin"], "ans": 0, "cat": "Cardiac & Circulation", "page": 3}, {"id": "A19", "set": "A", "num": 19, "q": "The wheezing associated with left-sided heart failure results from which of the following?", "opts": ["fluid in the lungs", "chronic bronchitis", "chest muscle tightness", "chest wall expansion"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 3}, {"id": "A20", "set": "A", "num": 20, "q": "A patient is found in a back bedroom lying supine on the bed with a hunting knife embedded in her anterior chest, midline below the right breast. The patient is in obvious respiratory distress. She is cold, clammy, and diaphoretic with flat neck veins. You hear diminished breath sounds on the right side. This patient most likely is suffering from which of the following?", "opts": ["pneumothorax", "pericardial tamponade", "tension pneumothorax", "hemothorax"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 4}, {"id": "A21", "set": "A", "num": 21, "q": "A greenstick fracture is one that is which of the following?", "opts": ["open", "impacted", "partial", "comminuted"], "ans": 2, "cat": "Trauma, Fractures & Spinal", "page": 4}, {"id": "A22", "set": "A", "num": 22, "q": "The first step in managing a burn patient is to perform which of the following?", "opts": ["Estimate the percentage and degree of burns.", "Assess airway and breathing status.", "Prevent contamination by applying sterile burn dressings.", "Stop the burning process."], "ans": 3, "cat": "Burns", "page": 4}, {"id": "A23", "set": "A", "num": 23, "q": "A burn wound that blisters is an example of which of the following?", "opts": ["first-degree burn", "second-degree burn", "third-degree burn", "chemical burn"], "ans": 1, "cat": "Burns", "page": 4}, {"id": "A24", "set": "A", "num": 24, "q": "An adult who has burns over both sides of one arm and both sides of one leg would be estimated to have burns over what percentage of body surface area?", "opts": ["9%", "18%", "27%", "36%"], "ans": 2, "cat": "Burns", "page": 4, "exp": "Arm = 9% (both sides of one whole arm). Leg = 18% (both sides of one whole leg). 9 + 18 = 27%."}, {"id": "A25", "set": "A", "num": 25, "q": "What is the reason for giving inhaled beta agonists to patients with severe allergic reactions?", "opts": ["to increase heart rate and contractile force", "to block histamine receptors so edema is lessened", "to help suppress the inflammatory response", "to reverse bronchospasm and relax airways"], "ans": 3, "cat": "Diabetic, Allergy & Medical", "page": 4}, {"id": "A26", "set": "A", "num": 26, "q": "Which of the following situations represents expressed consent?", "opts": ["The patient says, “Help me. My chest hurts.”", "The patient is eight years old with no parent present.", "The patient is unconscious and unresponsive.", "The patient says, “I don’t need any help. Just let me die.”"], "ans": 0, "cat": "Patient Assessment & Vitals", "page": 4}, {"id": "A27", "set": "A", "num": 27, "q": "An intoxicated person refuses treatment or transport. How should you proceed?", "opts": ["Do as the patient wishes and leave the scene immediately.", "Try to find a family member to get consent for treatment.", "Try to persuade the person to accept your assistance.", "Immediately document the refusal, and then leave the scene."], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 5}, {"id": "A28", "set": "A", "num": 28, "q": "What should you determine first in this situation?", "opts": ["whether the other crew is treating patients inside and needs your help", "whether this is a potential hazardous-materials incident in progress", "whether the other crew has been overcome and needs your immediate assistance", "whether you need more oxygen and supplies than your ambulance carries"], "ans": 1, "cat": "Operations, Ethics & Equipment", "page": 5, "ctx": "Answer questions 28 and 29 based on the following information. You respond to a 25-patient mass casualty incident at a store. The 911 caller stated that she smelled something “funny” and then started to feel weak and nauseous. You are the second unit on the scene. The initial unit is nowhere to be seen and they do not answer their radios."}, {"id": "A29", "set": "A", "num": 29, "q": "After you are instructed by the hazardous materials team to begin treating decontaminated patients, you should perform which of the following?", "opts": ["Take universal precautions and wear protective equipment.", "Begin your efforts with the least symptomatic patient first.", "Get ready to treat the patients as you would at any other scene.", "Thoroughly question the first patient for purposes of documentation."], "ans": 0, "cat": "Operations, Ethics & Equipment", "page": 5, "ctx": "Answer questions 28 and 29 based on the following information. You respond to a 25-patient mass casualty incident at a store. The 911 caller stated that she smelled something “funny” and then started to feel weak and nauseous. You are the second unit on the scene. The initial unit is nowhere to be seen and they do not answer their radios."}, {"id": "A30", "set": "A", "num": 30, "q": "You respond to a call for a five-year-old male patient who has fallen 2 metres from a ladder. You would expect what type of injuries in this patient?", "opts": ["forearm fractures", "head and neck injuries", "compression fractures of the lumbar spine", "sprains and dislocations of the ankle or knee"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 5}, {"id": "A31", "set": "A", "num": 31, "q": "An unrestrained driver of a small car struck a tree at high speed. He has a distended abdomen that is tender when palpated. Vital signs are pulse 120 BPM, respirations 20 breaths per minute, and blood pressure 116/90 mmHg. What would be the most likely cause of the abdominal tenderness?", "opts": ["bacterial peritonitis", "abdominal muscle strain", "organ damage", "seat belt injury"], "ans": 2, "cat": "Airway, Breathing & Oxygen", "page": 5}, {"id": "A32", "set": "A", "num": 32, "q": "Which of the following is an indication of a positive Battle’s sign?", "opts": ["basilar skull fracture", "orbital skull fracture", "subarachnoid hemorrhage", "cervical spinal trauma"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 5}, {"id": "A33", "set": "A", "num": 33, "q": "In response to pain, your trauma patient opens her eyes, withdraws her hand, and speaks only in garbled sounds. What is her Glasgow Coma Scale score?", "opts": ["5", "7", "8", "11"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 6, "exp": "Eyes open to pain = 2, withdraws from pain = 4, incomprehensible (garbled) sounds = 2. Total = 8."}, {"id": "A34", "set": "A", "num": 34, "q": "A patient has been stabbed in the back. Which of the following signs would most likely make you suspect that the patient has a kidney injury?", "opts": ["abdominal tenderness", "hematuria", "thirst", "ecchymosis of the flank"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 6}, {"id": "A35", "set": "A", "num": 35, "q": "What does the disease process of emphysema cause within the lung tissues?", "opts": ["a buildup of fluid due to increased capillary permeability", "deflation of a portion of the lung due to the rupture of a bleb", "bronchoconstriction due to increased airway resistance", "a loss of elasticity in the alveoli due to distention and destruction"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 6}, {"id": "A36", "set": "A", "num": 36, "q": "Which of the following best describes an isotonic solution?", "opts": ["It has an electrolyte composition like that of blood plasma.", "It is used only in patients who are severely dehydrated.", "It has a higher solute composition than the body cells.", "It has a lower solute composition than the body cells."], "ans": 0, "cat": "IV Therapy & Fluids", "page": 6}, {"id": "A37", "set": "A", "num": 37, "q": "An injury to the ligaments surrounding a joint that is marked by pain, swelling, and bruising is called which of the following?", "opts": ["sprain", "strain", "dislocation", "arthritis"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 6}, {"id": "A38", "set": "A", "num": 38, "q": "A patient is complaining of chest pressure and shortness of breath. He has jugular venous distension and pedal edema. His lung sounds are clear and equal. Which of the following conditions most likely causes these findings?", "opts": ["left-sided heart failure", "right-sided heart failure", "pulmonary embolus", "cardiac asthma"], "ans": 1, "cat": "Cardiac & Circulation", "page": 6}, {"id": "A39", "set": "A", "num": 39, "q": "Your patient has a suspected hand injury. How can you best immobilize the hand in the position of function?", "opts": ["Tape it flat against the chest with the fingers extended outward together.", "Put the arm into a sling and swathe and allow the hand to dangle naturally.", "Place a roll of gauze bandage into the palm and secure the hand to a splint.", "Secure the hand to a padded splint with the hand clenched into a fist."], "ans": 2, "cat": "Trauma, Fractures & Spinal", "page": 6}, {"id": "A40", "set": "A", "num": 40, "q": "You are caring for a patient whose finger was just cut off in an accident. What should you do with the amputated finger?", "opts": ["Place the severed finger in a plastic bag and immerse the bag in cold water.", "Immerse the severed finger directly into a pail of ice-cold normal saline solution.", "Bandage the severed finger in sterile gauze and place it in a plastic bag with ice.", "Bandage the hand with the severed finger placed back into its normal position."], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 7}, {"id": "A41", "set": "A", "num": 41, "q": "Diabetic patients may develop hypoglycemia if they take too much insulin or if they", "opts": ["exercise too much with limited food intake.", "overeat and do not exercise enough.", "sit in a chair for prolonged periods of time.", "inject their insulin directly into a vein."], "ans": 0, "cat": "Diabetic, Allergy & Medical", "page": 7}, {"id": "A42", "set": "A", "num": 42, "q": "You are caring for a female patient who was struck by an automobile. She opens her eyes to voice command only, localizes pain when you pinch her arm, and is awake but confused. What is her Glasgow Coma Scale score?", "opts": ["6", "8", "12", "14"], "ans": 2, "cat": "Trauma, Fractures & Spinal", "page": 7, "exp": "Eyes open to voice = 3, localises pain = 5, confused speech = 4. Total = 12."}, {"id": "A43", "set": "A", "num": 43, "q": "What is the most common job-related source of HIV infections among healthcare workers?", "opts": ["assisting at emergency childbirth", "direct contact with a patient’s skin", "an accidental needle prick", "breathing contaminated air"], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 7}, {"id": "A44", "set": "A", "num": 44, "q": "Battle’s sign and Raccoon’s eyes are classic signs of which of the following conditions?", "opts": ["a basilar skull fracture", "intracerebral hemorrhage", "a subdural hematoma", "a depressed skull fracture"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 7}, {"id": "A45", "set": "A", "num": 45, "q": "An adult patient has burns covering her head and upper back. Using the rule of nines, this patient’s burns cover what percentage of her body surface area?", "opts": ["9%", "18%", "27%", "36%"], "ans": 1, "cat": "Burns", "page": 7, "exp": "Head = 9%, upper back (upper half of the posterior trunk) = 9%. 9 + 9 = 18%."}, {"id": "A46", "set": "A", "num": 46, "q": "How would you classify a burn that is pearly white and almost painless?", "opts": ["first-degree burn", "second-degree burn", "third-degree burn", "chemical burn"], "ans": 2, "cat": "Burns", "page": 7}, {"id": "A47", "set": "A", "num": 47, "q": "What is the Glasgow Coma Scale score for a patient who opens her eyes in response to pain, speaks incomprehensibly, and withdraws in response to pain?", "opts": ["6", "7", "8", "9"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 8, "exp": "Eyes open to pain = 2, incomprehensible sounds = 2, withdraws from pain = 4. Total = 8."}, {"id": "A48", "set": "A", "num": 48, "q": "Which breathing pattern is characteristic of diabetic ketoacidosis or other types of metabolic acidosis?", "opts": ["ataxic breathing", "Biot’s breathing", "Cheyne-Stokes breathing", "Kussmaul breathing"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 8}, {"id": "A49", "set": "A", "num": 49, "q": "Your patient is a 70-year-old male. He complains of chest pain that began while he was raking leaves. You perform an initial assessment and a focused history and physical examination and administer oxygen and nitroglycerin. The patient then states that he feels much better. From what is he most likely suffering?", "opts": ["stable angina", "unstable angina", "myocardial infarction", "cardiac arrest"], "ans": 0, "cat": "Cardiac & Circulation", "page": 8}, {"id": "A50", "set": "A", "num": 50, "q": "Which technique should you use to open the airway of a trauma patient?", "opts": ["the head-tilt/chin-lift", "the jaw thrust", "the head-tilt/neck-lift", "the sniffing position"], "ans": 1, "cat": "Airway, Breathing & Oxygen", "page": 8}, {"id": "A51", "set": "A", "num": 51, "q": "What respiratory pattern is characteristic of Kussmaul respiration?", "opts": ["increase in both rate and depth", "increase in respiratory rate only", "decrease in both rate and depth", "decrease in respiratory rate only"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 8}, {"id": "A52", "set": "A", "num": 52, "q": "What should you do if your examination of a limb suggests that it is fractured?", "opts": ["Apply traction to align the ends of long bones and position the joints.", "Treat it as if a fracture exists and immobilize it to prevent further injury.", "Check the proximal pulse, motor, and sensation, and adjust the position.", "Transport the patient as quickly as possible to preserve function of the limb."], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 8}, {"id": "A53", "set": "A", "num": 53, "q": "Which type of wound would most likely require a tourniquet?", "opts": ["amputation of the hand at the forearm", "bilateral open fractures of the femurs", "below-the-knee amputation by a machine", "tearing injury of the upper arm"], "ans": 3, "cat": "Trauma, Fractures & Spinal", "page": 8}, {"id": "A54", "set": "A", "num": 54, "q": "What is the role of beta-agonists, like salbutamol, in the treatment of anaphylaxis?", "opts": ["to relieve anxiety", "to prevent shock", "to raise blood pressure", "to reverse bronchospasm"], "ans": 3, "cat": "Diabetic, Allergy & Medical", "page": 9}, {"id": "A55", "set": "A", "num": 55, "q": "A high-velocity bullet passes through the body. Besides the direct damage caused by the bullet, what other related condition could cause harm to the patient?", "opts": ["the type of metal used to make the bullet", "the internal opening created by cavitation", "the gunpowder residue", "the length of the bullet"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 9}, {"id": "A56", "set": "A", "num": 56, "q": "A patient was hit several times in the left chest with the large end of a pool cue. The patient is in severe respiratory distress with tachycardia and tachypnea. Crepitus can be felt in multiple locations over the left anterior fourth, fifth, sixth, and seventh rib area. Lung sounds are clear and equal, but diminished. Which of the following conditions best describes the patient’s presentation?", "opts": ["flail chest", "tension pneumothorax", "pericardial tamponade", "pulmonary contusion"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 9}, {"id": "A57", "set": "A", "num": 57, "q": "What do orthostatic vital sign changes suggest for a patient with acute abdominal pain?", "opts": ["The patient has appendicitis.", "The patient is hypovolemic.", "The patient has peritonitis.", "The patient is a diabetic."], "ans": 1, "cat": "Diabetic, Allergy & Medical", "page": 9}, {"id": "A58", "set": "A", "num": 58, "q": "Which of the following is a disease that is associated with cigarette smoking and is related to, but distinct from, emphysema?", "opts": ["chronic bronchitis", "congestive heart failure", "simple pneumothorax", "spontaneous empyema"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 9}, {"id": "A59", "set": "A", "num": 59, "q": "A patient presents with symptoms of flushing, itching, hives, difficulty breathing, decreased blood pressure, and dizziness. What should you suspect?", "opts": ["diabetic coma", "anaphylaxis", "acute appendicitis", "stroke"], "ans": 1, "cat": "Diabetic, Allergy & Medical", "page": 9}, {"id": "A60", "set": "A", "num": 60, "q": "A patient in a very early stage of hypoglycemia may complain of which of the following?", "opts": ["drowsiness", "dry mouth", "nausea", "hunger"], "ans": 3, "cat": "Diabetic, Allergy & Medical", "page": 10}, {"id": "A61", "set": "A", "num": 61, "q": "In a motor vehicle crash, which of the following would be most important to understand in relation to the force of collision and the potential for injury?", "opts": ["speed at time of impact", "weight of the vehicle", "road conditions at the scene", "condition of the vehicle’s tires"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 10}, {"id": "A62", "set": "A", "num": 62, "q": "Which of the following injuries would require the use of an occlusive dressing?", "opts": ["a laceration to the abdomen with a section of protruding large intestines", "a deep laceration to the thigh", "avulsion involving the temporal region", "amputation proximal to the elbow"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 10}, {"id": "A63", "set": "A", "num": 63, "q": "Your patient is a 60-year-old woman who has fallen down her front steps and has possibly fractured her ankle. Which assessment finding may be considered abnormal in this patient?", "opts": ["altered mental status", "respirations regular", "pulse 68 and regular", "blood pressure 128/86 mmHg"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 10}, {"id": "A64", "set": "A", "num": 64, "q": "When splinting a limb with a suspected fracture, one caregiver applies the splint while another", "opts": ["holds the limb and monitors distal pulse, motor function, and sensation.", "calms, reassures, and provides emotional support to the patient.", "checks for limb alignment and administers high-flow oxygen.", "gets the stretcher or other supplies and monitors vital signs."], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 10}, {"id": "A65", "set": "A", "num": 65, "q": "On reaching the scene of a single motor vehicle accident, you note that the driver is pinned behind the steering wheel. You also note the presence of two sets of spiderweb patterns on the windshield. How should you proceed?", "opts": ["Look for a possible second victim in this accident.", "Suspect multiple injuries for this driver.", "Assume a high-speed collision has occurred.", "Expect that hit-and-run injuries have occurred."], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 10}, {"id": "A66", "set": "A", "num": 66, "q": "A male patient is complaining of crushing chest pressure and shortness of breath. His vital signs include RR 20 breaths per minute, P 54 BPM, and BP 132/74 mmHg. The ECG shows a sinus bradycardia with a first- degree AV block. Which of the following treatments would be most appropriate?", "opts": ["atropine 0.5 mg IV", "transcutaneous pacing", "nitroglycerin 0.4 mg sL", "dopamine 10 mcg/kg/min."], "ans": 2, "cat": "Cardiac & Circulation", "page": 11}, {"id": "A67", "set": "A", "num": 67, "q": "Your patient is a 65-year-old male who is complaining of pain in his abdomen, back, and flanks. His blood pressure is 90/60 mmHg. On examination, you note that the femoral pulses are markedly weaker than the radial pulses. Which should you do next?", "opts": ["Palpate the abdomen gently for a pulsatile mass.", "Administer dopamine to increase cardiac output.", "Treat for hypovolemia and transport rapidly.", "Administer furosemide, morphine, nitroglycerine, and oxygen."], "ans": 2, "cat": "Cardiac & Circulation", "page": 11}, {"id": "A68", "set": "A", "num": 68, "q": "Hyperventilation syndrome most often occurs in a patient who is which of the following?", "opts": ["anxious and upset", "asthmatic", "in shock from trauma", "a heavy smoker"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 11}, {"id": "A69", "set": "A", "num": 69, "q": "Your patient is an obese 77-year-old woman who has called EMS complaining of a sudden onset of dyspnea, coughing, hemoptysis, and diaphoresis. On examination, you note tachypnea and tachycardia, crackles and localized wheezing, and distended neck veins and varicose veins. You should suspect which of the following?", "opts": ["myocardial infarction", "pulmonary embolism", "aortic aneurysm", "status asthmaticus"], "ans": 1, "cat": "Airway, Breathing & Oxygen", "page": 11}, {"id": "A70", "set": "A", "num": 70, "q": "If it is not treated, left ventricular failure results in which of the following conditions?", "opts": ["ischemic heart disease", "pulmonary edema", "chronic hypertension", "cor pulmonale"], "ans": 1, "cat": "Cardiac & Circulation", "page": 11}, {"id": "A71", "set": "A", "num": 71, "q": "You are responding to a motor vehicle versus pedestrian crash. En route, you are advised the pedestrian is a seven-year-old female. Which injuries would you expect to find in this patient?", "opts": ["fractures to the lower extremities, flank, and shoulder, and head injuries", "fractures of the lower extremities and back, and head injuries", "retroperitoneal, lower back, and upper extremity injuries", "abdominal, chest, face, and head injuries"], "ans": 3, "cat": "Trauma, Fractures & Spinal", "page": 12}, {"id": "A72", "set": "A", "num": 72, "q": "Depression is an example of which of the following?", "opts": ["psychiatric illness", "psychosis", "mood disorder", "organic disease"], "ans": 2, "cat": "Diabetic, Allergy & Medical", "page": 12}, {"id": "A73", "set": "A", "num": 73, "q": "Which statement about airway obstruction caused by the tongue is FALSE?", "opts": ["The tongue is the most common cause of airway obstruction in an unconscious patient.", "Airway blockage does not depend on the position of the patient’s head, neck, and jaw", "The esophagus and epiglottis can contribute to airway blockage in an unconscious patient.", "The tongue can block the airway only when the patient is recumbent or supine."], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 12}, {"id": "A74", "set": "A", "num": 74, "q": "Asymmetrical movement during respiration typically suggests which condition?", "opts": ["COPD", "flail chest", "brain damage", "hemothorax"], "ans": 1, "cat": "Airway, Breathing & Oxygen", "page": 12}, {"id": "A75", "set": "A", "num": 75, "q": "A whistling or musical sound heard on exhalation is referred to as what abnormal breath sound?", "opts": ["snoring", "wheezing", "stridor", "friction rub"], "ans": 1, "cat": "Airway, Breathing & Oxygen", "page": 12}, {"id": "A76", "set": "A", "num": 76, "q": "Which set of signs and symptoms is characteristic of a patient in compensated shock?", "opts": ["lethargy, confusion, normal to slightly elevated pulse and blood pressure, cool skin, and delayed capillary refill", "coma; very low pulse and blood pressure; and pale, cold, and clammy skin with delayed capillary refill time", "lapsing into unconsciousness, moderately elevated pulse and blood pressure, mottling of extremities, and cyanosis around lips", "unconsciousness, bradycardia, dropping blood pressure, cold extremities, delayed capillary refill, and absent radial pulses"], "ans": 0, "cat": "Shock & Bleeding Control", "page": 12}, {"id": "A77", "set": "A", "num": 77, "q": "Your patient, a middle-aged female, is a pedestrian struck by a car. She opens her eyes only in response to pain and makes no verbal response; her best motor response is withdrawal in response to pain. What is the Glasgow Coma Scale score for this patient?", "opts": ["3", "5", "7", "9"], "ans": 2, "cat": "Trauma, Fractures & Spinal", "page": 13, "exp": "Eyes open to pain = 2, no verbal response = 1, withdraws from pain = 4. Total = 7."}, {"id": "A78", "set": "A", "num": 78, "q": "Your patient is an adult female whom you suspect is unconscious as a result of an upper- airway obstruction. You use the head-tilt/chin-lift method to open her airway and then attempt a ventilation, which is unsuccessful. What is the next thing you should do?", "opts": ["Give five thrusts on her abdomen.", "Give five chest thrusts on her sternum.", "Finger-sweep from cheek to cheek.", "Reposition and attempt to ventilate again."], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 13}, {"id": "A79", "set": "A", "num": 79, "q": "Your patient is a 67-year-old male who reports a smoking history of 45 packs per year, frequent respiratory infections, and a chronic cough. He is overweight and has peripheral cyanosis. Auscultation of the chest reveals rhonchi. There is also noticeable jugular vein distention. What disease process should you suspect?", "opts": ["emphysema", "status asthmaticus", "chronic bronchitis", "lung cancer"], "ans": 2, "cat": "Airway, Breathing & Oxygen", "page": 13}, {"id": "A80", "set": "A", "num": 80, "q": "Blood enters the right atrium of the heart through which of the following structures?", "opts": ["tricuspid valve", "right ventricle", "left pulmonary arteries", "superior and inferior vena cava"], "ans": 3, "cat": "Cardiac & Circulation", "page": 13}, {"id": "A81", "set": "A", "num": 81, "q": "Which statement about hypoglycemia is correct?", "opts": ["Hypoglycemia may occur in nondiabetic patients, especially in chronic alcoholics.", "In nondiabetics, hypoglycemia usually results from overeating and too much exercise.", "Signs and symptoms of hypoglycemia are slow in onset and develop over several hours.", "In late stages of hypoglycemia, the patient may complain of extreme hunger and thirst."], "ans": 0, "cat": "Diabetic, Allergy & Medical", "page": 13}, {"id": "A82", "set": "A", "num": 82, "q": "The signs and symptoms of cerebral hemorrhage include", "opts": ["disorientation and confusion, decreased pulse and blood pressure, and cyanosis.", "transient loss of consciousness, headache, drowsiness, nausea, and vomiting.", "leakage of cerebrospinal fluid, headache, and bleeding from the nose or ears.", "headache, Battle’s sign, confusion, lethargy, and rapid loss of consciousness."], "ans": 1, "cat": "Shock & Bleeding Control", "page": 14}, {"id": "A83", "set": "A", "num": 83, "q": "Blood flows from the pulmonary veins into which structure?", "opts": ["left atrium of the heart", "right atrium of the heart", "capillaries of the lungs", "right ventricle of the heart"], "ans": 0, "cat": "Cardiac & Circulation", "page": 14}, {"id": "A84", "set": "A", "num": 84, "q": "Unilateral wheezing in a 14-month-old child is suggestive of which of the following?", "opts": ["asthma", "aspiration of a foreign body", "heart failure", "croup"], "ans": 1, "cat": "Airway, Breathing & Oxygen", "page": 14}, {"id": "A85", "set": "A", "num": 85, "q": "Anxiety may be best defined as which of the following?", "opts": ["a general feeling of uneasiness", "an unconscious reaction to a stressor", "a factor or event that causes stress", "regulation of involuntary movement"], "ans": 0, "cat": "Diabetic, Allergy & Medical", "page": 14}, {"id": "A86", "set": "A", "num": 86, "q": "An adult with burns over the front of both arms and the chest is burned over what percentage of her body surface area (BSA)?", "opts": ["9%", "13%", "18%", "27%"], "ans": 2, "cat": "Burns", "page": 14, "exp": "Front of each arm = 4.5% (9% total for both), anterior chest = 9%. 9 + 9 = 18%."}, {"id": "A87", "set": "A", "num": 87, "q": "How will the skin over a second-degree burn appear?", "opts": ["bright red", "mottled red", "pearly white", "charred black"], "ans": 1, "cat": "Burns", "page": 14}, {"id": "A88", "set": "A", "num": 88, "q": "General management for a patient with altered mental status should include which of the following procedures?", "opts": ["providing low-flow oxygen", "applying a 12-lead ECG", "determining blood glucose levels", "administering dextrose routinely"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 14}, {"id": "A89", "set": "A", "num": 89, "q": "What are the two most common causes of severe anaphylaxis?", "opts": ["shellfish and roasted peanuts", "aspirin and synthetic opiates", "egg whites and sesame seeds", "penicillin and insect bites/stings"], "ans": 3, "cat": "Diabetic, Allergy & Medical", "page": 15}, {"id": "A90", "set": "A", "num": 90, "q": "What is the greatest concern when a person experiences blunt force trauma to the head?", "opts": ["It can interrupt the integrity of the blood brain barrier.", "It can cause a significant increase in intracranial pressure.", "It can cause significant ringing in the ears.", "It can lacerate the scalp, causing bleeding."], "ans": 1, "cat": "Shock & Bleeding Control", "page": 15}, {"id": "A91", "set": "A", "num": 91, "q": "Bradycardia refers to a heart rate that is less than how many beats per minute?", "opts": ["30", "40", "50", "60"], "ans": 3, "cat": "Cardiac & Circulation", "page": 15}, {"id": "A92", "set": "A", "num": 92, "q": "For which of the following procedures is it necessary to wear gloves, gown, mask, and protective eyewear?", "opts": ["starting an IV in a moving ambulance", "bleeding control with minimal bleeding", "assisting with an emergency childbirth", "administering an intramuscular injection"], "ans": 2, "cat": "Shock & Bleeding Control", "page": 15}, {"id": "B1", "set": "B", "num": 1, "q": "Your 68-year-old male patient is complaining of severe chest pain radiating to the left arm. He is cool, pale and diaphoretic. As you begin treatment, your patient tells you that the last time he had this type of pain his doctor told him he had a “bad” heart attack. The information concerning his previous heart attack is part of which component of the patient history?", "opts": ["Chief complain", "Past medical history", "LOTARP", "History of present illness"], "ans": 1, "cat": "Cardiac & Circulation", "page": 15}, {"id": "B2", "set": "B", "num": 2, "q": "Which airway maneuver would you perform in an unconscious patient with spinal injuries?", "opts": ["Jaw thrust", "Head tilt chin", "Modified jaw thrust", "Heimlich maneuver"], "ans": 2, "cat": "Airway, Breathing & Oxygen", "page": 15}, {"id": "B3", "set": "B", "num": 3, "q": "In the assessment of a patient’s mental status using the AVPU scale, the A stands for", "opts": ["Alive", "Alert", "Appropriate", "Affect"], "ans": 1, "cat": "Patient Assessment & Vitals", "page": 16}, {"id": "B4", "set": "B", "num": 4, "q": "In the assessment of a patient’s mental status using the AVPU scale, the V stands for", "opts": ["Vital", "Veto", "Verbal", "Vastus"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 16}, {"id": "B5", "set": "B", "num": 5, "q": "All of the following are components of secondary survey except:", "opts": ["Past & present medical history", "Chief complain", "History taking", "Rapid body survey"], "ans": 3, "cat": "Patient Assessment & Vitals", "page": 16}, {"id": "B6", "set": "B", "num": 6, "q": "All of the following are components of primary survey except:", "opts": ["Skin color & condition", "Level of consciousness", "Vital signs", "Rapid body survey"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 16}, {"id": "B7", "set": "B", "num": 7, "q": "As part of your ongoing assessment of an unstable trauma patient, you should reassess your patient", "opts": ["Every 20 minutes", "Every 15 minutes", "Every 10 minutes", "Every 5 minutes"], "ans": 3, "cat": "Patient Assessment & Vitals", "page": 16}, {"id": "B8", "set": "B", "num": 8, "q": "As part of your ongoing assessment of a stable trauma patient, you should reassess your patient", "opts": ["Every 20 minutes", "Every 15 minutes", "Every 10 minutes", "Every 5 minutes"], "ans": 1, "cat": "Patient Assessment & Vitals", "page": 16}, {"id": "B9", "set": "B", "num": 9, "q": "What is the primary objective in performing a head to toe examination?", "opts": ["To detect limb & life threatening injuries", "To detect less obvious injuries or problems", "To detect airway problems", "To detect airway problems & limb threatening injuries"], "ans": 1, "cat": "Patient Assessment & Vitals", "page": 16}, {"id": "B10", "set": "B", "num": 10, "q": "During the head to toe examination, you assess the neck for", "opts": ["Jugular vein distension & tracheal deviation", "Tracheal deviation only", "Jugular vein distension only", "Flat neck veins"], "ans": 0, "cat": "Patient Assessment & Vitals", "page": 17}, {"id": "B11", "set": "B", "num": 11, "q": "During head to toe examination, you palpate the four quadrants of the abdomen for all of the following except", "opts": ["Tenderness & guarding", "Penetrating injuries", "Distension & palpable masses", "Paradoxical motion"], "ans": 3, "cat": "Patient Assessment & Vitals", "page": 17}, {"id": "B12", "set": "B", "num": 12, "q": "During head to toe examination, you assess the lower extremities for all of the following except:", "opts": ["Capillary refill", "Distal pulses", "Paradoxical motion", "Sensation & movement"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 17}, {"id": "B13", "set": "B", "num": 13, "q": "Adult respiratory rate should be within", "opts": ["8 to 12 breaths per min", "12 to 20 breaths per minute", "20 to 30 breaths per minute", "12 to 30 breaths per minute"], "ans": 1, "cat": "Airway, Breathing & Oxygen", "page": 17}, {"id": "B14", "set": "B", "num": 14, "q": "Which of the following is not part of the secondary survey?", "opts": ["Chief complain (CC)", "Past and present medical history", "Rescue scene evaluation", "Allergies"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 17}, {"id": "B15", "set": "B", "num": 15, "q": "When checking the patient’s medication during secondary survey, what do you need to look out for?", "opts": ["Note for compliance with prescribed dosing regimen", "Time and amount of last dose", "Locate any bottles or vials in the vicinity and bring to the hospital", "All of the above"], "ans": 3, "cat": "Patient Assessment & Vitals", "page": 17}, {"id": "B16", "set": "B", "num": 16, "q": "You are attending to a 67-year-old elderly who is complaining of chest pain. You are trying to obtain the patient’s history of chief complaint. What kind of questions would you ask the patient to find out what is the precipitating factor to his chief complaint?", "opts": ["Does anything make it worse?", "When was the last time you had a similar episode?", "What were you doing before the chest pain was felt?", "Where is the location of the discomfort?"], "ans": 2, "cat": "Patient Assessment & Vitals", "page": 17}, {"id": "B17", "set": "B", "num": 17, "q": "When examining a female patient, you do of all of the following except", "opts": ["Tell patient that you are treating and examining for injuries.", "Just before you examine any part of the body, inform patient that you are going to examine that part of the body before doing so.", "Remove all clothing", "Examination and treat the patient systemically"], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 18}, {"id": "B18", "set": "B", "num": 18, "q": "You are trying to obtain the patient’s history of chief complaint. What kind of questions would you ask the patient to find out what was the aggravating factor to the patient’s chief complaint?", "opts": ["Does anything make it worse?", "When was the last time you had a similar episode?", "What were you doing before", "Where is the location of the discomfort?"], "ans": 0, "cat": "Patient Assessment & Vitals", "page": 18}, {"id": "B19", "set": "B", "num": 19, "q": "Which of the following statement about the Golden Hour is false?", "opts": ["The first hour after severe injury", "The most critical period in a trauma", "Measured from the time of impact to the time of effective intervention", "Measured from time treatment is rendered to the time patient is transported to the hospital"], "ans": 3, "cat": "Patient Assessment & Vitals", "page": 18}, {"id": "B20", "set": "B", "num": 20, "q": "What is the sequence in performing a head to toe examination?", "opts": ["Head, neck, chest, abdomen, pelvis, lower limbs, upper limbs & back", "Back, upper limbs, lower limbs, pelvis, abdomen, chest, neck & head", "Head, neck, chest, abdomen, pelvis, upper limbs, lower limbs & back", "Back, head, neck, chest, abdomen, pelvis, upper limbs & lower limbs"], "ans": 0, "cat": "Patient Assessment & Vitals", "page": 18}, {"id": "B21", "set": "B", "num": 21, "q": "Which of the following should you not perform when managing a patient with an impaled object on the eye?", "opts": ["Do not remove impaled objects", "Stabilize object with sterile gauze (cut hole in centre)", "Place paper cup over impaled object to enclose eye without touching it", "Fasten in place tightly with bandage"], "ans": 3, "cat": "Trauma, Fractures & Spinal", "page": 18}, {"id": "B22", "set": "B", "num": 22, "q": "You are treating a patient with epistaxis (nose bleed). Which of the following should you not perform?", "opts": ["Pinch the bridge of the nostrils", "Position in sitting or semi-sitting, leaning forward", "Breathe slowly through mouth", "Breathe through the nose & lean backwards"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 18}, {"id": "B23", "set": "B", "num": 23, "q": "Facial injuries can be life threatening as it causes all of the following except:", "opts": ["Airway obstruction & asphyxiation", "Profuse bleeding which could lead to shock", "Injury to the cervical spine & the spinal cord", "Injury to the heart"], "ans": 3, "cat": "Shock & Bleeding Control", "page": 18}, {"id": "B24", "set": "B", "num": 24, "q": "Management of a patient with flail chest should include all of the following except:", "opts": ["Splint manually with a pillow", "Encourage deep breathing", "Administer high flow O₂", "Transport patient in a prone position"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 19}, {"id": "B25", "set": "B", "num": 25, "q": "Management of a patient with simple pneumothorax should include all of the following except:", "opts": ["Administer high flow O₂", "Place patient in a position of comfort", "Transport rapidly", "Administering IV dextrose 10% at maintenance rate"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 19}, {"id": "B26", "set": "B", "num": 26, "q": "Which of the following is not a sign or symptom of open pneumothorax?", "opts": ["Bubbling with sucking noise at wound", "Rapid, shallow & laboured breathing", "Hemoptysis", "Hypertension"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 19}, {"id": "B27", "set": "B", "num": 27, "q": "Treatment for a patient with an impaled metal rod in the chest area should include all except", "opts": ["Position the patient with knees bend", "Stabilizing the impale metal rod with bulky dressing", "Transporting the patient immediately to the nearest hospital", "Assisting respirations with bag valve mask"], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 19}, {"id": "B28", "set": "B", "num": 28, "q": "Which of the following regarding application of cervical collar is false?", "opts": ["The head must be neutral position before the collar can be applied properly", "Continue moving the head and immobilize the head in that position if there is severe resistance or movement", "The measurement is the distance between and imaginary line drawn across the top of the shoulder and the bottom of the patient’s chin.", "Patient must in either sitting or supine position"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 19}, {"id": "B29", "set": "B", "num": 29, "q": "You are treating a patient with an altered mental status. He replies with inappropriate words. With painful stimuli, he opens his eyes and withdraws from the stimuli. What is his score on the Glasgow Coma Scale?", "opts": ["9", "10", "11", "12"], "ans": 0, "cat": "Patient Assessment & Vitals", "page": 19, "exp": "Eyes open to pain = 2, inappropriate words = 3, withdraws from pain = 4. Total = 9."}, {"id": "B30", "set": "B", "num": 30, "q": "You are treating a patient with an altered mental status. He is confused and disorientated. With painful stimuli, he opens his eyes and withdraws from the stimuli. What is his score on the Glasgow Coma Scale?", "opts": ["9", "10", "11", "12"], "ans": 1, "cat": "Patient Assessment & Vitals", "page": 20, "exp": "Eyes open to pain = 2, confused = 4, withdraws from pain = 4. Total = 10."}, {"id": "B31", "set": "B", "num": 31, "q": "Your 55-year-old male patient is complaining of difficulty in breathing. He is cyanotic (blue) and breathing at a rate of 32 times per minute. What is the appropriate oxygen delivery device for this patient?", "opts": ["Nasal cannula", "Non rebreathing mask", "Simple face mask", "Bag valve mask"], "ans": 3, "cat": "Airway, Breathing & Oxygen", "page": 20}, {"id": "B32", "set": "B", "num": 32, "q": "Your 65-year-old male patient is complaining of difficulty in breathing. He is breathing at 32 times per minute SPO2 92%. What is the appropriate oxygen delivery device for this patient?", "opts": ["Nasal cannula", "Non rebreathing mask", "Simple face mask", "Nebulizer mask"], "ans": 2, "cat": "Airway, Breathing & Oxygen", "page": 20}, {"id": "B33", "set": "B", "num": 33, "q": "You are assessing an unconscious patient who has vomitus in his airway. You should immediately:", "opts": ["Suction the airway", "Perform ECG monitoring", "Insert an airway guerdal", "Start IV normal saline"], "ans": 0, "cat": "Airway, Breathing & Oxygen", "page": 20}, {"id": "B34", "set": "B", "num": 34, "q": "You are assessing an unconscious patient. You should perform all of the following except the following at scene:", "opts": ["Checking the blood glucose level", "Administer high flow oxygen", "Insert an airway guerdal", "Perform head to toe examination"], "ans": 3, "cat": "Patient Assessment & Vitals", "page": 20}, {"id": "B35", "set": "B", "num": 35, "q": "In patients with head injury, __________ is the best indicator of the degree of injury?", "opts": ["Absence of sensation", "Respiratory pattern", "Reflexes", "Level of consciousness (LOC)"], "ans": 3, "cat": "Trauma, Fractures & Spinal", "page": 20}, {"id": "B36", "set": "B", "num": 36, "q": "Rising intracranial pressure in a head injury patient would produce", "opts": ["Rising pulse rate & rising blood pressure", "Falling pulse rate & rising blood pressure", "Falling pulse rate & falling blood pressure", "Rising pulse rate & falling blood pressure"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 21}, {"id": "B37", "set": "B", "num": 37, "q": "A man was burned on the full circumference of both arms and full circumference of his right thigh. His percentage of burns is approximately", "opts": ["18%", "27%", "32%", "36%"], "ans": 1, "cat": "Burns", "page": 21, "exp": "Both arms at full circumference = 9% + 9% = 18%. A whole leg is 18%, so the thigh alone is about 9%. 18 + 9 = 27%."}, {"id": "B38", "set": "B", "num": 38, "q": "An impaled object may be removed if", "opts": ["It is impaled in the eye", "It is too large to easily stabilize", "It is impaled in the cheek", "It interferes with splinting"], "ans": 2, "cat": "Trauma, Fractures & Spinal", "page": 21}, {"id": "B39", "set": "B", "num": 39, "q": "Which of the following is not a sign of pericardial tamponade?", "opts": ["Muffled heart sounds", "Distended neck veins", "Tracheal deviation", "Narrowed pulse pressure"], "ans": 2, "cat": "Cardiac & Circulation", "page": 21}, {"id": "B40", "set": "B", "num": 40, "q": "A 35-year-old male has been rescued from his burning basement by fire fighters. The patient is now responsive to pain and has a second and third degree burns over 40% of his body. Your most immediate concern is", "opts": ["Controlling the airway and ventilation", "Treating for hypovolemic shock", "Applying moist dressings to the burns", "Preventing infection"], "ans": 0, "cat": "Burns", "page": 21}, {"id": "B41", "set": "B", "num": 41, "q": "A normal capillary refill time is usually", "opts": ["Less than 1 second", "Less than 2 seconds", "Greater than 2 seconds", "Less than 4 seconds"], "an l injury & take spinal precaution", "Check if the victim can move his arms & legs", "Move the victim to the road shoulder"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 22}, {"id": "B48", "set": "B", "num": 48, "q": "What should you do when attending to an elderly person with a 5 cm laceration on the forearm that is bleeding profusely?", "opts": ["Apply a tourniquet to his or her forearm immediately", "Elevate his or her forearm and apply direct pressure with a large pad and perform wound management", "Flush his or her forearm with water", "Elevate the lower limbs"], "ans": 1, "cat": "Shock & Bleeding Control", "page": 22}, {"id": "B49", "set": "B", "num": 49, "q": "A man had been stabbed in the chest with a knife. The knife is now impaled on the right side of his chest. What should you do?", "opts": ["Remove the knife and apply pressure onto the chest", "Stabilize the knife with large pad and doughnut and apply triangular bandage", "Remove the knife and flush the wound with water", "Push the knife further in and apply large pad"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 22}, {"id": "B50", "set": "B", "num": 50, "q": "Which of the following positions should a victim with a suspected spinal injury be in when applying the cervical collar?", "opts": ["Prone (face down)", "Recumbent position", "Lateral (on either the left or right side)", "Supine (face up) with the head & body in neutral position"], "ans": 3, "cat": "Trauma, Fractures & Spinal", "page": 23}, {"id": "B51", "set": "B", "num": 51, "q": "What would you do when you see bone ends sticking out from a victim’s leg?", "opts": ["Apply a large pad directly on top of the bone and bandage it", "Stabilize the bone ends with large pad and doughnut dressing before applying crepe bandage", "Push the bone ends in and apply a large pad over it", "Pull the bone ends out and apply a large pad over it"], "ans": 1, "cat": "Trauma, Fractures & Spinal", "page": 23}, {"id": "B52", "set": "B", "num": 52, ize the head", "Turn casualty to the left", "Stabilize casualty in sitting position", "Change grips"], "ans": 2, "cat": "Trauma, Fractures & Spinal", "page": 26}, {"id": "B74", "set": "B", "num": 74, "q": "Which of the following tourniquets are you likely to apply in a casualty who is bleeding profusely from an amputated wound over the right forearm?", "opts": ["Italian", "Russian", "French", "Dutch"], "ans": 3, "cat": "Shock & Bleeding Control", "page": 26}, {"id": "B75", "set": "B", "num": 75, "q": "Rapid Body Survey (RBS) should be completed in ______________", "opts": ["More than 30 seconds", "Less than 30 seconds", "More than 1 minute", "Less than 2 minutes"], "ans": 1, "cat": "Patient Assessment & Vitals", "page": 27}, {"id": "B76", "set": "B", "num": 76, "q": "Which of the following tourniquets would you likely to apply in a casualty who is bleeding profusely from an amputated wound over the left thigh?", "opts": ["Italian", "Russian", "French", "Dutch"], "ans": 1, "cat": "Shock & Bleeding Control", "page": 27}, {"id": "B77", "set": "B", "num": 77, "q": "Why is status epilepticus (continous seizure) life threatening?", "opts": ["It may cause hypovolemic shock", "It may lead to death due to apnea & hypoxia", "It may lead to myocardial infarction", "It may cause cardiac arrhythmias"], "ans": 1, "cat": "Diabetic, Allergy & Medical", "page": 27}, {"id": "B78", "set": "B", "num": 78, "q": "Seizures are caused by all of the following except", "opts": ["Head trauma", "Infection", "Cerebral haemorrhage", "Pneumothorax"], "ans": 3, "cat": "Diabetic, Allergy & Medical", "page": 27}, {"id": "B79", "set": "B", "num": 79, "q": "The Glasgow Coma Scale uses all of the following variables to identify mental status except:", "opts": ["Visual response", "Respiratory rate", "Motor response", "Verbal response"], "ans": 1, "cat": "Patient Assessment & Vitals", "page": 27}, {"id": "B80", "set": "B", "num": 80, "q": "You should complete performing Rapid Body Survey (RBS) in", "opts
