vices.", "Civic, Lentor & Red Cross Ambulance Services.", "SGH, NTFGH & CGH Ambulance Services.", "Econ, Unistrong & Hope Ambulance Services."], "ans": 0, "cat": "Operations, Ethics & Equipment", "page": 53}, {"id": "B237", "set": "B", "num": 237, "q": "Which of the following is not a healthcare cluster in MOH?", "opts": ["Eastern Health Alliance.", "Jurong Health Services.", "Changi Frontier Alliance.", "Alexandra Health System."], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 53}, {"id": "B238", "set": "B", "num": 238, "q": "Which of the following is not a situation whereby you can call OPS Centre for assistance?", "opts": ["A case of bed ridden patient who is having a Nasogastric tube in place.", "A case of locked door with an awful decomposes smell.", "A case of conveying bariatric patient.", "A case of an aggressive group who refused to cooperate to receive medical attention."], "ans": 0, "cat": "Operations, Ethics & Equipment", "page": 53}, {"id": "B239", "set": "B", "num": 239, "q": "Which of the following is incorrect when performing documentation following the handover of a patient to the hospital?", "opts": ["Subsequent management should be mentioned under “event surrounding” portion in ACR together with abnormal findings in assessment.", "All relevant information should be recorded in ACR", "Print out patient heart rhythm results from ZOLL for recording purposes.", "All abnormal findings should be mentioned under the “event surrounding” portion in the ACR."], "ans": 0, "cat": "Operations, Ethics & Equipment", "page": 54}, {"id": "B240", "set": "B", "num": 240, "q": "Whilst going down a slope, how do you manoeuvre the stretcher when the patient is in supine position?", "opts": ["Sideways", "Head pointing downwards towards the slope", "Legs pointing downwards towards the slope", "Upside down"], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 54}, {"id": "B241", "set": "B", "num": 241, "q": "When approaching a curb, how do you move the casualty who is in a sitting position up the curb on a stretcher?", "opts": ["Patient facing towards the curb and jack the two front wheels first", "Patient facing away the curb and lift up the two back wheels first", "Patient facing the laterally of the curb and lift up the both the right side of the wheels", "Ask the patient to come down from the stretcher and carry up."], "ans": 0, "cat": "Operations, Ethics & Equipment", "page": 54}, {"id": "B242", "set": "B", "num": 242, "q": "How do you transport an obese unconscious casualty without spinal injuries onto a stretcher?", "opts": ["Arms carry the casualty and place him on the stretcher in a supine position", "Log-roll him onto the PVC canvas, lift the canvas together with the patient, and lay him onto the stretcher in a supine position", "Arms carry the casualty and place him on the stretcher in a fowler position", "Log-roll him onto the PVC canvas, lift the canvas together with the patient, and lay him onto the stretcher in a prone position"], "ans": 1, "cat": "Operations, Ethics & Equipment", "page": 54}, {"id": "B243", "set": "B", "num": 243, "q": "What are some safety procedures upon placing a patient on a stretcher?", "opts": ["All limbs in the stretcher", "Buckle the patient up tightly and firmly", "Make sure you inform the patient before you switch positions of the stretcher", "All of the above"], "ans": 3, "cat": "Operations, Ethics & Equipment", "page": 54}, {"id": "B244", "set": "B", "num": 244, "q": "When transporting patients suspected of suffering from airborne disease, which of the following precautions should be taken?", "opts": ["Donning of glove", "Donning of Hazmat Suit", "Donning of PPE", "Donning of bunker gear"], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 54}, {"id": "B245", "set": "B", "num": 245, "q": "What is the purpose of elevation of a fractured limb?", "opts": ["To reduce swelling and pain.", "To keep limb warm.", "To prevent clotting of blood in fractured limb.", "To align fractured bone."], "ans": 0, "cat": "Trauma, Fractures & Spinal", "page": 55}, {"id": "B246", "set": "B", "num": 246, "q": "What do to look out for in signs of aggressiveness and or agitation?", "opts": ["Move away from crew or shrugs crew away and seems agitated.", "Patient stares with eyebrow down and together.", "Patient is uncooperative with alcohol smell.", "All of the above."], "ans": 3, "cat": "Operations, Ethics & Equipment", "page": 55}, {"id": "B247", "set": "B", "num": 247, "q": "What are the correct ways on communicating with patient and NOK in ROSE?", "opts": ["Before conducting any physical examination, seek permission and preserve patient modesty as much as reasonably possible.", "Ascertain location of patient or next-of-kin while en route to incident. Show a sense of urgency upon arrival and introduce yourself in a professional manner.", "Take care of your mannerisms and choice of words at all times in public places and treat cases with enthusiasm and dedication.", "All of the above."], "ans": 3, "cat": "Operations, Ethics & Equipment", "page": 55}, {"id": "B248", "set": "B", "num": 248, "q": "In the event of a minor vehicular accident, which of the following step is untrue?", "opts": ["Obtain particulars of driver of other vehicle.", "Call Tow Truck Company immediately as the waiting time is long. Explain to patient on board that they need to wait.", "If vehicular damages are minor and patient is in critical condition, the urgency of the situation should be relayed to the driver of the other vehicle.", "Issue Correspondence Notice to driver."], "ans": 1, "cat": "Operations, Ethics & Equipment", "page": 55}, {"id": "B249", "set": "B", "num": 249, "q": "Which of the following is incorrect when driving an ambulance attending to a call?", "opts": ["Do not use provocative gestures or language.", "Be observant, alert and adopt a defensive driving attitude.", "Sound the siren continuously to alert drivers in front to give way urgently without letting other road users to react.", "Put on Seat Belt and ensure your passengers are belted up too."], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 55}, {"id": "B250", "set": "B", "num": 250, "q": "Which of the following is a healthcare cluster under the MOH?", "opts": ["Singapore Medical Association", "Paya Lebar General Health System", "National Healthcare Group", "Jalan Besar Medical Centre"], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 56}, {"id": "B251", "set": "B", "num": 251, "q": "Which of the following is considered an emergency?", "opts": ["Paper cut", "Difficulty in breathing", "Toothache", "Transportation for Medical checkup"], "ans": 1, "cat": "Airway, Breathing & Oxygen", "page": 56}, {"id": "B252", "set": "B", "num": 252, "q": "Which of the following is the hotline for non-emergency cases?", "opts": ["1777", "999", "995", "6222"], "ans": 0, "cat": "Operations, Ethics & Equipment", "page": 56}, {"id": "B253", "set": "B", "num": 253, "q": "Which of the following protocols is an EMT not allowed to perform?", "opts": ["Unconscious Protocol", "Chest Pain Protocol", "Hypovolemia Protocol", "Bradycardia Protocol"], "ans": 3, "cat": "Operations, Ethics & Equipment", "page": 56}, {"id": "B254", "set": "B", "num": 254, "q": "Which of the following does not fall under eithical and legal responsibilities of EMT?", "opts": ["Explain to patient on all procedures and actions to be done.", "Retain sense of urgency while at scene.", "Make comments and create small talks while examine patient’s injuries.", "Do not use provocative gestures or language."], "ans": 2, "cat": "Operations, Ethics & Equipment", "page": 56}, {"id": "B255", "set": "B", "num": 255, "q": "Which of the following cases that we can request for additional assistance?", "opts": ["Unresponsive medium size man lying on the bench in the park.", "Aggressive drunk man holding a broken glass bottle and refuse to corporate.", "8 months old infant had a fall at playground with caregiver.", "30 years old female complaining of giddiness in public toilet."], "ans": 1, "cat": "Operations, Ethics & Equipment", "page": 56}, {"id": "B256", "set": "B", "num": 256, "q": "Which of the following is the correct pre-hospital framework when handling an emergency case?", "opts": ["Call dispatched -> Assess Patient’s condition -> report to control room -> position vehicle correctly", "Call dispatched -> Movement to incident site ->Position vehicle correctly -> Report to control room -> Assess patient’s condition", "Assess Patient’s condition -> report to control room -> Call dispatched -> position vehicle correctly", "Call dispatched -> position vehicle correctly -> Assess Patient’s condition -> report to control room -> Movement to incident site"], "ans": 1, "cat": "Operations, Ethics & Equipment", "page": 56}]</script>

  };

  /* ============================ THEME ============================ */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effectiveTheme() {
    if (settings.theme === 'dark') return 'dark';
    if (settings.theme === 'light') return 'light';
    return mq && mq.matches ? 'dark' : 'light';
  }
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', effectiveTheme());
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', effectiveTheme() === 'dark' ? '#080f15' : '#e9eef3');
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (settings.theme === 'auto') { applyTheme(); render(); } });
  applyTheme();

  /* ============================ SESSION ============================ */
  var session = null;
  var view = 'home';
  var browseState = { q: '', filter: 'all', cat: 'all', limit: 30, showAns: true };
  var tickHandle = null;

  function makeItems(ids) {
    return ids.map(function (id) {
      var order = [0, 1, 2, 3];
      if (settings.shuffleOpts) order = shuffle(order);
      return { id: id, order: order };
    });
  }
  function startSession(cfg) {
    // cfg: {ids, mode, title, subtitle, limitSec, shuffleQ}
    var ids = cfg.ids.slice();
    if (cfg.shuffleQ) ids = shuffle(ids);
    session = {
      mode: cfg.mode, title: cfg.title, subtitle: cfg.subtitle || '',
      items: makeItems(ids), answers: {}, flags: {}, idx: 0,
      startedAt: Date.now(), endsAt: cfg.limitSec ? Date.now() + cfg.limitSec * 1000 : null,
      limitSec: cfg.limitSec || null, finished: false, kind: cfg.kind || 'custom', arg: cfg.arg || null
    };
    saveSession();
    go('runner');
  }
  function saveSession() { if (session && !session.finished) store.set(K.sess, session); else store.del(K.sess); }
  function loadSession() {
    var s = store.get(K.sess, null);
    if (!s || typeof s !== 'object' || !Array.isArray(s.items) || !s.items.length || s.finished) return null;
    var valid = s.items.every(function (it) {
      return it && BY_ID[it.id] && Array.isArray(it.order) && it.order.length === 4;
    });
    if (!valid) { store.del(K.sess); return null; }
    s.answers = plainObject(s.answers);
    s.flags = plainObject(s.flags);
    if (typeof s.idx !== 'number' || s.idx < 0 || s.idx >= s.items.length) s.idx = 0;
    if (typeof s.startedAt !== 'number') s.startedAt = Date.now();
    if (s.mode !== 'test') s.mode = 'practice';
    if (typeof s.title !== 'string' || !s.title) s.title = 'Practice';
    return s;
  }
  function curItem() { return session.items[session.idx]; }
  function curQ() { return BY_ID[curItem().id]; }
  function answeredCount() { return Object.keys(session.answers).length; }
  function isAnswered(i) { return session.answers[i] != null; }

  function pickAnswer(displayIdx) {
    var it = curItem(), q = BY_ID[it.id];
    var original = it.order[displayIdx];
    if (session.mode === 'practice') {
      if (isAnswered(session.idx)) return;
      session.answers[session.idx] = original;
      applyStat(q.id, original === q.ans);
      saveSession();
      renderRunner(true, '[data-act="next"],[data-act="submit"]');
      if (settings.autoNext && original === q.ans) {
        window.setTimeout(function () {
          if (session && !session.finished && session.idx < session.items.length - 1) { session.idx++; saveSession(); renderRunner(); }
        }, 700);
      }
    } else {
      session.answers[session.idx] = original;
      saveSession();
      renderRunner(true);
    }
  }
  function finishSession() {
    if (!session || session.finished) return;
    if (session.mode === 'test') {
      session.items.forEach(function (it, i) {
        var a = session.answers[i];
        if (a != null) applyStat(it.id, a === BY_ID[it.id].ans);
      });
    }
    var total = session.items.length, correct = 0, answered = 0;
    session.items.forEach(function (it, i) {
      var a = session.answers[i];
      if (a != null) { answered++; if (a === BY_ID[it.id].ans) correct++; }
    });
    session.finished = true;
    session.result = {
      total: total, correct: correct, answered: answered,
      dur: Math.round((Date.now() - session.startedAt) / 1000),
      at: Date.now()
    };
    progress.tests.unshift({
      at: session.result.at, mode: session.mode, title: session.title,
      correct: correct, total: total, dur: session.result.dur
    });
    progress.tests = progress.tests.slice(0, 30);
    saveProgress();
    store.del(K.sess);
    stopTimer();
    go('results');
  }

  /* ============================ POOLS ============================ */
  function allIds() { return QS.map(function (q) { return q.id; }); }
  function idsWrong() { return QS.filter(function (q) { return isWrong(q.id); }).map(function (q) { return q.id; }); }
  function idsBookmarked() { return QS.filter(function (q) { return bookmarks[q.id]; }).map(function (q) { return q.id; }); }
  function idsUnseen() { return QS.filter(function (q) { return !isSeen(q.id); }).map(function (q) { return q.id; }); }
  function idsCat(c) { return QS.filter(function (q) { return q.cat === c; }).map(function (q) { return q.id; }); }
  function idsBlock(set, from, to) {
    return QS.filter(function (q) { return q.set === set && q.num >= from && q.num <= to; }).map(function (q) { return q.id; });
  }
  function blocksFor(set) {
    var list = QS.filter(function (q) { return q.set === set; }).sort(function (a, b) { return a.num - b.num; });
    var out = [], SZ = 25;
    for (var i = 0; i < list.length; i += SZ) {
      var chunk = list.slice(i, i + SZ);
      out.push({ from: chunk[0].num, to: chunk[chunk.length - 1].num, ids: chunk.map(function (q) { return q.id; }) });
    }
    return out;
  }

  function startKind(kind, arg) {
    if (kind === 'mock') {
      var pool = shuffle(allIds()).slice(0, Math.min(MOCK_N, QS.length));
      return startSession({ ids: pool, mode: 'test', title: 'Mock test', subtitle: MOCK_N + ' questions · ' + MOCK_MIN + ' min', limitSec: MOCK_MIN * 60, kind: kind });
    }
    if (kind === 'quick') {
      return startSession({ ids: shuffle(allIds()).slice(0, 20), mode: 'practice', title: 'Quick practice', subtitle: '20 random questions', kind: kind });
    }
    if (kind === 'cat') {
      return startSession({ ids: idsCat(arg), mode: 'practice', title: arg, subtitle: 'Topic practice', shuffleQ: settings.shuffleQ, kind: kind, arg: arg });
    }
    if (kind === 'block') {
      var p = arg.split(':'), r = p[1].split('-');
      return startSession({
        ids: idsBlock(p[0], +r[0], +r[1]), mode: 'practice',
        title: SET_LABEL[p[0]] + ' · Q' + r[0] + '–' + r[1], subtitle: 'Question bank order',
        shuffleQ: false, kind: kind, arg: arg
      });
    }
    if (kind === 'setall') {
      return startSession({ ids: idsBlock(arg, 0, 9999), mode: 'practice', title: SET_LABEL[arg] + ' · all questions', subtitle: 'Question bank order', shuffleQ: false, kind: kind, arg: arg });
    }
    if (kind === 'wrong') {
      return startSession({ ids: idsWrong(), mode: 'practice', title: 'Mistakes', subtitle: 'Questions you last got wrong', shuffleQ: settings.shuffleQ, kind: kind });
    }
    if (kind === 'bookmarks') {
      return startSession({ ids: idsBookmarked(), mode: 'practice', title: 'Saved questions', subtitle: 'Your bookmarks', shuffleQ: false, kind: kind });
    }
    if (kind === 'unseen') {
      return startSession({ ids: idsUnseen(), mode: 'practice', title: 'New questions', subtitle: 'Not attempted yet', shuffleQ: settings.shuffleQ, kind: kind });
    }
    if (kind === 'all') {
      return startSession({ ids: allIds(), mode: 'practice', title: 'All 346 questions', subtitle: 'Full bank', shuffleQ: settings.shuffleQ, kind: kind });
    }
  }

  /* ============================ TIMER ============================ */
  function stopTimer() { if (tickHandle) { window.clearInterval(tickHandle); tickHandle = null; } }
  function startTimer() {
    stopTimer();
    if (!session || !session.endsAt) return;
    tick();
    tickHandle = window.setInterval(tick, 1000);
  }
  function tick() {
    if (!session || !session.endsAt || session.finished) { stopTimer(); return; }
    var left = (session.endsAt - Date.now()) / 1000;
    var el = document.getElementById('timer');
    if (el) {
      el.textContent = clock(left);
      el.className = 'timer' + (left <= 60 ? ' crit' : (left <= 300 ? ' warn' : ''));
    }
    if (left <= 0) { stopTimer(); finishSession(); }
  }

  /* ============================ MODAL ============================ */
  var modalOpen = false;
  function openModal(opts) {
    var ov = document.getElementById('overlay');
    modalOpen = true;
    ov.innerHTML =
      '<div class="sheet-backdrop" data-act="modal-close">' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '" data-stop="1">' +
      '<h3>' + esc(opts.title) + '</h3>' +
      (opts.body ? '<p>' + opts.body + '</p>' : '') +
      (opts.html || '') +
      '<div class="stack">' + opts.actions.map(function (a, i) {
        return '<button class="btn ' + (a.kind || 'btn-ghost') + ' btn-block" data-act="modal-action" data-i="' + i + '">' + esc(a.label) + '</button>';
      }).join('') + '</div></div></div>';
    modalActions = opts.actions;
    var first = ov.querySelector('.btn');
    if (first && first.focus) first.focus();
  }
  var modalActions = [];
  function closeModal() {
    modalOpen = false; modalActions = [];
    document.getElementById('overlay').innerHTML = '';
  }

  /* ============================ NAV ============================ */
  function go(v) {
    view = v;
    closeModal();
    render();
    scrollTop(0);
  }

  /* ============================ RENDER: SHELL ============================ */
  function topbar(opts) {
    var left = opts.back
      ? '<button class="iconbtn" data-act="' + opts.back + '" aria-label="Back">' + ICON.back + '</button>'
      : '<span class="brandmark">' +
      '<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--brand)"/><path d="M4 17h5l2-6 3 12 3-9 2 3h9" fill="none" stroke="var(--brand-soft)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<span>EMT Question Bank</span></span>';
    var mid = opts.title
      ? '<div style="min-width:0;flex:1"><div class="tb-title">' + esc(opts.title) + '</div>' +
      (opts.sub ? '<div class="tb-sub">' + esc(opts.sub) + '</div>' : '') + '</div>'
      : '<div class="spacer"></div>';
    return '<header class="topbar"><div class="topbar-inner">' + left + mid + (opts.right || '') + '</div>' +
      (opts.progress != null ? '<div class="qprogress"><span style="width:' + opts.progress + '%"></span></div>' : '') +
      '</header>';
  }
  function themeBtn() {
    return '<button class="iconbtn" data-act="theme" aria-label="Switch between light and dark">' +
      (effectiveTheme() === 'dark' ? ICON.sun : ICON.moon) + '</button>';
  }

  function render() {
    stopTimer();
    var root = document.getElementById('root');
    if (view === 'home') root.innerHTML = viewHome();
    else if (view === 'topics') root.innerHTML = viewTopics();
    else if (view === 'sets') root.innerHTML = viewSets();
    else if (view === 'runner') { root.innerHTML = viewRunner(); startTimer(); }
    else if (view === 'results') root.innerHTML = viewResults();
    else if (view === 'browse') root.innerHTML = viewBrowse();
    else if (view === 'stats') root.innerHTML = viewStats();
    else if (view === 'settings') root.innerHTML = viewSettings();
    else root.innerHTML = viewHome();
    if (view === 'browse') {
      var inp = document.getElementById('searchbox');
      if (inp) {
        inp.value = browseState.q;
        inp.addEventListener('input', function () {
          browseState.q = inp.value; browseState.limit = 30;
          var l = document.getElementById('browselist');
          if (l) l.innerHTML = browseListHTML();
        });
      }
    }
  }

  /* ============================ VIEW: HOME ============================ */
  function viewHome() {
    var total = QS.length;
    var mastered = QS.filter(function (q) { return isMastered(q.id); }).length;
    var wrong = idsWrong().length;
    var seen = QS.filter(function (q) { return isSeen(q.id); }).length;
    var saved = idsBookmarked().length;
    var ringPct = pct(mastered, total);
    var C = 2 * Math.PI * 42;
    var resume = loadSession();
    var lastTests = progress.tests.slice(0, 3);

    return topbar({ right: themeBtn() + '<button class="iconbtn" data-act="go" data-view="settings" aria-label="Settings">' + ICON.gear + '</button>' }) +
      '<section class="hero"><div class="hero-inner">' +
      '<div class="eyebrow">EMT-CT &amp; MOCT · 2017 bank</div>' +
      '<h1 class="title">346 questions.<br>Ready for Friday.</h1>' +
      '<p class="lede">Every question and marked answer from your Medical/Trauma bank — as timed mock tests, topic drills, or straight revision.</p>' +
      '<svg class="ecgband" viewBox="0 0 700 56" preserveAspectRatio="none" aria-hidden="true">' +
      '<path class="ghost" d="M0 32h60l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h100"/>' +
      '<path class="lead" d="M0 32h60l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h55l10-18 9 34 11-26 8 10h100"/>' +
      '</svg>' +
      '</div></section>' +

      '<main class="app-main" id="main"><div class="wrap">' +

      (resume ? '<div class="section-h"><h2>Pick up where you left off</h2></div>' +
        '<button class="startcard primary" data-act="resume">' +
        '<span class="sc-ic">' + ICON.play + '</span>' +
        '<span><span class="sc-name">Resume ' + esc(resume.title) + '</span>' +
        '<span class="sc-desc">Question ' + (resume.idx + 1) + ' of ' + resume.items.length +
        (resume.endsAt ? ' · ' + clock((resume.endsAt - Date.now()) / 1000) + ' left' : '') + '</span></span>' +
        '<span class="chev">' + ICON.chev + '</span></button>' +
        '<button class="btn btn-quiet btn-block" style="margin-top:6px" data-act="discard">Discard and start something new</button>'
        : '') +

      '<div class="section-h"><h2>Your progress</h2><span class="count">' + seen + ' of ' + total + ' attempted</span></div>' +
      '<div class="card card-pad statcard">' +
      '<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="' + ringPct + '% of questions answered correctly on the last attempt">' +
      '<circle class="bgc" cx="50" cy="50" r="42"/>' +
      '<circle class="fgc" cx="50" cy="50" r="42" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - ringPct / 100)).toFixed(1) + '" transform="rotate(-90 50 50)"/>' +
      '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="21">' + ringPct + '%</text>' +
      '</svg>' +
      '<div class="minigrid">' +
      '<div class="mini"><span class="n ok">' + mastered + '</span><span class="l">Correct</span></div>' +
      '<div class="mini"><span class="n bad">' + wrong + '</span><span class="l">To fix</span></div>' +
      '<div class="mini"><span class="n">' + (total - seen) + '</span><span class="l">Untouched</span></div>' +
      '</div></div>' +

      '<div class="section-h"><h2>Start practising</h2></div>' +
      '<div class="stack">' +
      tile('primary', ICON.timer, 'Mock test', MOCK_N + ' questions · ' + MOCK_MIN + ' minutes · pass at ' + PASS_PCT + '%', 'start', 'mock') +
      tile('', ICON.play, 'Quick practice', '20 random questions with instant answers', 'start', 'quick') +
      tile('', ICON.layers, 'Practice by topic', CATS.length + ' topics, from airway to operations', 'go', null, 'topics') +
      tile('', ICON.grid, 'Practice by paper', 'Work through Paper 1 and 2 in order, 25 at a time', 'go', null, 'sets') +
      tile('', ICON.redo, 'Fix my mistakes', wrong ? wrong + ' question' + (wrong === 1 ? '' : 's') + ' you last got wrong' : 'Nothing wrong yet — take a test first', 'start', 'wrong', null, !wrong) +
      tile('', ICON.star, 'Saved questions', saved ? saved + ' bookmarked' : 'Bookmark questions while you practise', 'start', 'bookmarks', null, !saved) +
      tile('', ICON.book, 'Study mode', 'Read all 346 questions with answers shown', 'go', null, 'browse') +
      tile('', ICON.chart, 'Statistics', 'Accuracy by topic and past test scores', 'go', null, 'stats') +
      '</div>' +

      (lastTests.length ? '<div class="section-h"><h2>Recent sessions</h2></div>' +
        lastTests.map(function (t) {
          var p = pct(t.correct, t.total);
          return '<div class="listrow" style="cursor:default">' +
            '<div style="flex:1;min-width:0"><div class="lr-name">' + esc(t.title) + '</div>' +
            '<div class="lr-sub">' + fmtDate(t.at) + ' · ' + clock(t.dur) + '</div></div>' +
            '<div style="text-align:right"><div class="lr-name" style="color:' + (p >= PASS_PCT ? 'var(--ok)' : (p >= 60 ? 'var(--amber)' : 'var(--alert)')) + '">' + p + '%</div>' +
            '<div class="lr-sub">' + t.correct + '/' + t.total + '</div></div></div>';
        }).join('') : '') +

      '<p class="foot">Answers are taken from the marked options in <span class="mono">EMT-CT &amp; MOCT Medical/Trauma Question Bank 2017 v1</span>.<br>' +
      (store.available ? 'Progress is saved on this device only.' : 'Private browsing detected — progress will not be saved after you close this tab.') + '</p>' +
      '</div></main>';
  }

  function tile(cls, ic, name, desc, act, kind, viewName, disabled) {
    return '<button class="startcard ' + cls + '"' + (disabled ? ' disabled' : '') +
      ' data-act="' + act + '"' + (kind ? ' data-kind="' + kind + '"' : '') + (viewName ? ' data-view="' + viewName + '"' : '') +
      (disabled ? ' aria-disabled="true" style="opacity:.5"' : '') + '>' +
      '<span class="sc-ic">' + ic + '</span>' +
      '<span style="min-width:0"><span class="sc-name">' + esc(name) + '</span><span class="sc-desc">' + esc(desc) + '</span></span>' +
      '<span class="chev">' + ICON.chev + '</span></button>';
  }

  /* ============================ VIEW: TOPICS ============================ */
  function viewTopics() {
    return topbar({ back: 'home', title: 'Practice by topic', sub: CATS.length + ' topics', right: themeBtn() }) +
      '<main class="app-main" id="main"><div class="wrap" style="padding-top:18px">' +
      CATS.map(function (c) {
        var ids = idsCat(c);
        var done = ids.filter(function (i) { return isMastered(i); }).length;
        var p = pct(done, ids.length);
        return '<button class="listrow" data-act="start" data-kind="cat" data-arg="' + esc(c) + '">' +
          '<div style="flex:1;min-width:0">' +
          '<div class="lr-name">' + esc(c) + '</div>' +
          '<div class="lr-sub">' + done + '/' + ids.length + ' correct</div>' +
          '<div class="bar"><span class="' + (p >= 80 ? 'ok' : p >= 40 ? 'amber' : '') + '" style="width:' + p + '%"></span></div>' +
          '</div><span class="chev">' + ICON.chev + '</span></button>';
      }).join('') +
      '<div class="section-h"><h2>Everything at once</h2></div>' +
      '<button class="startcard" data-act="start" data-kind="all"><span class="sc-ic">' + ICON.layers + '</span>' +
      '<span><span class="sc-name">All 346 questions</span><span class="sc-desc">One long practice run</span></span>' +
      '<span class="chev">' + ICON.chev + '</span></button>' +
      '<div style="height:8px"></div>' +
      '<button class="startcard" data-act="start" data-kind="unseen"><span class="sc-ic">' + ICON.play + '</span>' +
      '<span><span class="sc-name">Only what I have not seen</span><span class="sc-desc">' + idsUnseen().length + ' question' + (idsUnseen().length === 1 ? '' : 's') + ' left</span></span>' +
      '<span class="chev">' + ICON.chev + '</span></button>' +
      '</div></main>';
  }

  /* ============================ VIEW: SETS ============================ */
  function viewSets() {
    var html = topbar({ back: 'home', title: 'Practice by paper', sub: 'Question bank order', right: themeBtn() }) +
      '<main class="app-main" id="main"><div class="wrap" style="padding-top:6px">';
    ['A', 'B'].forEach(function (set) {
      var blocks = blocksFor(set);
      var all = idsBlock(set, 0, 9999);
      var done = all.filter(function (i) { return isMastered(i); }).length;
      html += '<div class="section-h"><h2>' + SET_LABEL[set] + '</h2><span class="count">' + done + '/' + all.length + ' correct</span></div>' +
        '<button class="startcard" data-act="start" data-kind="setall" data-arg="' + set + '">' +
        '<span class="sc-ic">' + ICON.layers + '</span><span><span class="sc-name">Whole paper</span>' +
        '<span class="sc-desc">' + all.length + ' questions in order</span></span><span class="chev">' + ICON.chev + '</span></button>' +
        '<div style="height:10px"></div>';
      blocks.forEach(function (b) {
        var d = b.ids.filter(function (i) { return isMastered(i); }).length;
        var p = pct(d, b.ids.length);
        html += '<button class="listrow" data-act="start" data-kind="block" data-arg="' + set + ':' + b.from + '-' + b.to + '">' +
          '<div style="flex:1;min-width:0"><div class="lr-name">Q' + b.from + ' – Q' + b.to + '</div>' +
          '<div class="lr-sub">' + d + '/' + b.ids.length + ' correct</div>' +
          '<div class="bar"><span class="' + (p >= 80 ? 'ok' : p >= 40 ? 'amber' : '') + '" style="width:' + p + '%"></span></div></div>' +
          '<span class="chev">' + ICON.chev + '</span></button>';
      });
    });
    return html + '</div></main>';
  }

  /* ============================ VIEW: RUNNER ============================ */
  function viewRunner() {
    if (!session || !session.items.length) { view = 'home'; return viewHome(); }
    var i = session.idx, it = curItem(), q = curQ();
    var isTest = session.mode === 'test';
    var answer = session.answers[i];
    var answered = answer != null;
    var showFeedback = !isTest && answered;

    var right =
      '<button class="iconbtn" data-act="bookmark" aria-pressed="' + (bookmarks[q.id] ? 'true' : 'false') +
      '" aria-label="' + (bookmarks[q.id] ? 'Remove bookmark' : 'Bookmark this question') + '">' +
      (bookmarks[q.id] ? ICON.starF : ICON.star) + '</button>' +
      '<button class="iconbtn" data-act="navsheet" aria-label="Jump to a question">' + ICON.grid + '</button>';

    var head = topbar({
      back: 'quit', title: session.title, sub: 'Question ' + (i + 1) + ' of ' + session.items.length,
      right: right, progress: Math.round(((i + (answered ? 1 : 0)) / session.items.length) * 100)
    });

    var opts = it.order.map(function (orig, d) {
      var cls = 'opt', mark = '';
      if (isTest) {
        if (answer === orig) cls += ' chosen';
      } else if (answered) {
        cls += ' locked';
        if (orig === q.ans) { cls += ' correct'; mark = ICON.check; }
        else if (orig === answer) { cls += ' wrong'; mark = ICON.x; }
        else cls += ' dim';
      }
      return '<button class="' + cls + '" data-act="pick" data-i="' + d + '"' +
        (showFeedback ? ' aria-disabled="true"' : '') + '>' +
        '<span class="key">' + LETTERS[d] + '</span>' +
        '<span>' + esc(q.opts[orig]) + '</span>' +
        '<span class="mark">' + mark + '</span></button>';
    }).join('');

    var verdict = '';
    if (showFeedback) {
      var good = answer === q.ans;
      var correctLetter = LETTERS[it.order.indexOf(q.ans)];
      verdict = '<div class="verdict ' + (good ? 'good' : 'bad') + '" role="status">' +
        '<span style="color:var(--' + (good ? 'ok' : 'alert') + ');flex:none;margin-top:1px">' + (good ? ICON.check : ICON.x) + '</span>' +
        '<span class="vtxt"><b>' + (good ? 'Correct.' : 'Not quite — the answer is ' + correctLetter + '.') + '</b> ' +
        (good ? '' : esc(q.opts[q.ans])) +
        (q.exp ? '<span style="display:block;margin-top:7px">' + esc(q.exp) + '</span>' : '') +
        '<span class="src">' + esc(qRef(q)) + ' · ' + esc(q.cat) + '</span></span></div>';
    }

    var ctx = q.ctx ? '<div class="ctxbox"><h3>Scenario</h3><p>' + esc(q.ctx) + '</p></div>' : '';
    var img = q.img ? '<img class="qimg" src="' + ECG_IMG + '" alt="12-lead ECG for this question">' : '';

    var body =
      '<main class="app-main" id="main"><div class="wrap">' +
      '<div class="qmeta">' +
      '<span class="chip brand">' + esc(q.cat) + '</span>' +
      '<span class="chip">' + esc(qRef(q)) + '</span>' +
      (session.flags[i] ? '<span class="chip" style="color:var(--amber)">Flagged</span>' : '') +
      '</div>' +
      ctx +
      '<h2 class="qtext">' + esc(q.q) + '</h2>' +
      img +
      '<div class="opts">' + opts + '</div>' +
      verdict +
      '</div></main>';

    var bar = '<div class="actionbar"><div class="actionbar-inner">' +
      (session.endsAt ? '<span class="timer" id="timer">' + clock((session.endsAt - Date.now()) / 1000) + '</span>' : '') +
      '<button class="btn btn-ghost" data-act="prev"' + (i === 0 ? ' disabled' : '') + ' aria-label="Previous question">Back</button>' +
      (isTest ? '<button class="iconbtn" data-act="flag" aria-pressed="' + (session.flags[i] ? 'true' : 'false') + '" aria-label="Flag for review">' + ICON.flag + '</button>' : '') +
      '<div class="spacer"></div>' +
      (i === session.items.length - 1
        ? '<button class="btn btn-primary" data-act="submit">' + (isTest ? 'Submit test' : 'Finish') + '</button>'
        : '<button class="btn btn-primary" data-act="next">Next</button>') +
      '</div></div>';

    return head + body + bar;
  }

  function renderRunner(keepScroll, focusSel) {
    var y = window.pageYOffset;
    var root = document.getElementById('root');
    root.innerHTML = viewRunner();
    startTimer();
    if (keepScroll) scrollTop(y); else scrollTop(0);
    var target = focusSel ? document.querySelector(focusSel) : null;
    if (target && target.focus) { try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); } }
  }

  function navSheet() {
    var cells = session.items.map(function (it, i) {
      var a = session.answers[i], cls = 'navcell';
      if (a != null) {
        if (session.mode === 'practice') cls += a === BY_ID[it.id].ans ? ' correct' : ' wrong';
        else cls += ' answered';
      }
      if (session.flags[i]) cls += ' flagged';
      if (i === session.idx) cls += ' current';
      return '<button class="' + cls + '" data-act="jump" data-i="' + i + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
    }).join('');
    openModal({
      title: 'Jump to a question',
      body: answeredCount() + ' of ' + session.items.length + ' answered' +
        (session.mode === 'test' ? ' · ' + Object.keys(session.flags).length + ' flagged' : ''),
      html: '<div class="navgrid">' + cells + '</div>',
      actions: [{ label: 'Close', kind: 'btn-ghost', fn: closeModal }]
    });
  }

  /* ============================ VIEW: RESULTS ============================ */
  function viewResults() {
    if (!session || !session.result) { view = 'home'; return viewHome(); }
    var r = session.result, p = pct(r.correct, r.total);
    var isTest = session.mode === 'test';
    var passed = p >= PASS_PCT;
    var wrongItems = session.items.filter(function (it, i) {
      var a = session.answers[i]; return a == null || a !== BY_ID[it.id].ans;
    });

    var byCat = {};
    session.items.forEach(function (it, i) {
      var q = BY_ID[it.id], a = session.answers[i];
      if (!byCat[q.cat]) byCat[q.cat] = { c: 0, t: 0 };
      byCat[q.cat].t++; if (a === q.ans) byCat[q.cat].c++;
    });

    var list = session.items.map(function (it, i) {
      var q = BY_ID[it.id], a = session.answers[i];
      var good = a === q.ans;
      return '<div class="qcard">' +
        '<div class="qh"><span class="qn">' + (i + 1) + '</span><div style="flex:1"><div class="qq">' + esc(q.q) + '</div>' +
        '<div class="lr-sub" style="margin-top:4px">' + esc(qRef(q)) + '</div></div>' +
        '<span style="color:var(--' + (good ? 'ok' : 'alert') + ');flex:none">' + (good ? ICON.check : ICON.x) + '</span></div>' +
        '<ol>' + q.opts.map(function (o, oi) {
          var mine = a === oi, isAns = oi === q.ans;
          var st = isAns ? ' class="is-ans"' : (mine ? ' style="box-shadow:inset 0 0 0 1px var(--alert);color:var(--alert)"' : '');
          return '<li' + st + '><span class="k">' + LETTERS[oi] + '</span><span>' + esc(o) +
            (mine && !isAns ? ' <em style="font-style:normal;font-family:var(--mono);font-size:11px"> ← you</em>' : '') +
            (isAns ? ' <em style="font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ok)"> ✓ answer</em>' : '') +
            '</span></li>';
        }).join('') + '</ol>' +
        (q.exp ? '<div class="ctxmini" style="margin:10px 0 0">' + esc(q.exp) + '</div>' : '') + '</div>';
    }).join('');

    return topbar({ back: 'home', title: 'Results', sub: session.title, right: themeBtn() }) +
      '<main class="app-main" id="main"><div class="wrap">' +
      '<div class="card scorehead" style="margin-top:18px">' +
      '<div class="scorebig" style="color:' + (passed ? 'var(--ok)' : (p >= 60 ? 'var(--amber)' : 'var(--alert)')) + '">' + p + '%</div>' +
      '<div style="font-family:var(--mono);color:var(--muted);margin-top:6px">' + r.correct + ' of ' + r.total + ' correct · ' + clock(r.dur) + '</div>' +
      (isTest ? '<div class="badge ' + (passed ? 'pass' : 'fail') + '">' + (passed ? 'Pass' : 'Below ' + PASS_PCT + '%') + '</div>' : '') +
      (r.answered < r.total ? '<div class="lr-sub" style="margin-top:10px">' + (r.total - r.answered) + ' left unanswered</div>' : '') +
      '</div>' +

      '<div class="stack" style="margin-top:14px">' +
      (wrongItems.length ? '<button class="btn btn-primary btn-block" data-act="retrywrong">Retry the ' + wrongItems.length + ' I missed</button>' : '') +
      '<button class="btn btn-ghost btn-block" data-act="again">Start the same again</button>' +
      '<button class="btn btn-quiet btn-block" data-act="home">Back to home</button>' +
      '</div>' +

      '<div class="section-h"><h2>By topic</h2></div>' +
      Object.keys(byCat).map(function (c) {
        var v = byCat[c], pp = pct(v.c, v.t);
        return '<div class="listrow" style="cursor:default"><div style="flex:1;min-width:0">' +
          '<div class="lr-name">' + esc(c) + '</div><div class="lr-sub">' + v.c + '/' + v.t + '</div>' +
          '<div class="bar"><span class="' + (pp >= 80 ? 'ok' : pp >= 40 ? 'amber' : 'bad') + '" style="width:' + pp + '%"></span></div>' +
          '</div></div>';
      }).join('') +

      '<div class="section-h"><h2>Every question</h2><span class="count">answers shown</span></div>' +
      list +
      '</div></main>';
  }

  /* ============================ VIEW: BROWSE ============================ */
  function browseFiltered() {
    var q = browseState.q.trim().toLowerCase();
    return QS.filter(function (item) {
      if (browseState.cat !== 'all' && item.cat !== browseState.cat) return false;
      var f = browseState.filter;
      if (f === 'A' && item.set !== 'A') return false;
      if (f === 'B' && item.set !== 'B') return false;
      if (f === 'saved' && !bookmarks[item.id]) return false;
      if (f === 'wrong' && !isWrong(item.id)) return false;
      if (f === 'unseen' && isSeen(item.id)) return false;
      if (!q) return true;
      if (item.q.toLowerCase().indexOf(q) >= 0) return true;
      if (item.opts.some(function (o) { return o.toLowerCase().indexOf(q) >= 0; })) return true;
      if (item.ctx && item.ctx.toLowerCase().indexOf(q) >= 0) return true;
      return false;
    });
  }
  function browseListHTML() {
    var list = browseFiltered();
    if (!list.length) {
      return '<div class="empty">' + ICON.inbox + '<h3>Nothing matches</h3><p>Try a different word or clear the filters.</p>' +
        '<button class="btn btn-ghost" data-act="clearfilters">Clear filters</button></div>';
    }
    var slice = list.slice(0, browseState.limit);
    var html = '<div class="lr-sub" style="margin:2px 0 10px">' + list.length + ' question' + (list.length === 1 ? '' : 's') + '</div>' +
      slice.map(function (q) {
        return '<div class="qcard">' +
          (q.ctx ? '<div class="ctxmini">' + esc(q.ctx) + '</div>' : '') +
          '<div class="qh"><span class="qn">' + esc(SET_LABEL[q.set].replace('Paper ', 'P')) + '·' + q.num + '</span>' +
          '<div class="qq">' + esc(q.q) + '</div></div>' +
          (q.img ? '<img class="qimg" src="' + ECG_IMG + '" alt="12-lead ECG for this question">' : '') +
          '<ol>' + q.opts.map(function (o, oi) {
            return '<li' + (browseState.showAns && oi === q.ans ? ' class="is-ans"' : '') + '>' +
              '<span class="k">' + LETTERS[oi] + '</span><span>' + esc(o) + '</span></li>';
          }).join('') + '</ol>' +
          (browseState.showAns && q.exp ? '<div class="ctxmini" style="margin:10px 0 0">' + esc(q.exp) + '</div>' : '') +
          '<div class="qfoot">' +
          '<button class="fchip" data-act="bmtoggle" data-id="' + q.id + '" aria-pressed="' + (bookmarks[q.id] ? 'true' : 'false') + '">' +
          (bookmarks[q.id] ? '★ Saved' : '☆ Save') + '</button>' +
          '<span class="chip">' + esc(q.cat) + '</span>' +
          (isWrong(q.id) ? '<span class="chip" style="color:var(--alert)">Got it wrong</span>' : '') +
          (isMastered(q.id) ? '<span class="chip" style="color:var(--ok)">Got it right</span>' : '') +
          '</div></div>';
      }).join('');
    if (list.length > slice.length) {
      html += '<button class="btn btn-ghost btn-block" data-act="loadmore">Show more (' + (list.length - slice.length) + ' left)</button>';
    }
    return html;
  }
  function viewBrowse() {
    var filters = [['all', 'All'], ['A', SET_LABEL.A], ['B', SET_LABEL.B], ['saved', 'Saved'], ['wrong', 'Mistakes'], ['unseen', 'Unseen']];
    return topbar({
      back: 'home', title: 'Study mode', sub: 'Search, read, memorise',
      right: '<button class="iconbtn" data-act="toggleans" aria-label="' + (browseState.showAns ? 'Hide answers' : 'Show answers') +
        '" title="' + (browseState.showAns ? 'Hide answers' : 'Show answers') + '">' + (browseState.showAns ? ICON.eye : ICON.eyeOff) + '</button>' + themeBtn()
    }) +
      '<main class="app-main" id="main"><div class="wrap" style="padding-top:16px">' +
      '<div class="searchwrap"><span class="si">' + ICON.search + '</span>' +
      '<input id="searchbox" type="search" placeholder="Search questions and answers" aria-label="Search questions">' +
      (browseState.q ? '<button class="clr" data-act="clearsearch" aria-label="Clear search">' + ICON.x + '</button>' : '') +
      '</div>' +
      '<div class="filters">' + filters.map(function (f) {
        return '<button class="fchip" data-act="filter" data-arg="' + f[0] + '" aria-pressed="' + (browseState.filter === f[0] ? 'true' : 'false') + '">' + esc(f[1]) + '</button>';
      }).join('') + '</div>' +
      '<div class="filters">' +
      '<button class="fchip" data-act="catfilter" data-arg="all" aria-pressed="' + (browseState.cat === 'all' ? 'true' : 'false') + '">All topics</button>' +
      CATS.map(function (c) {
        return '<button class="fchip" data-act="catfilter" data-arg="' + esc(c) + '" aria-pressed="' + (browseState.cat === c ? 'true' : 'false') + '">' + esc(shortCat(c)) + '</button>';
      }).join('') + '</div>' +
      '<div id="browselist">' + browseListHTML() + '</div>' +
      '</div></main>';
  }

  /* ============================ VIEW: STATS ============================ */
  function viewStats() {
    var total = QS.length;
    var attempted = QS.filter(function (q) { return isSeen(q.id); }).length;
    var right = QS.filter(function (q) { return isMastered(q.id); }).length;
    var tries = 0, hits = 0;
    Object.keys(progress.byId).forEach(function (id) { tries += progress.byId[id].c + progress.byId[id].w; hits += progress.byId[id].c; });

    return topbar({ back: 'home', title: 'Statistics', sub: 'All-time', right: themeBtn() }) +
      '<main class="app-main" id="main"><div class="wrap" style="padding-top:18px">' +
      '<div class="card card-pad"><div class="minigrid">' +
      '<div class="mini"><span class="n">' + attempted + '/' + total + '</span><span class="l">Attempted</span></div>' +
      '<div class="mini"><span class="n ok">' + pct(hits, tries) + '%</span><span class="l">Lifetime accuracy</span></div>' +
      '<div class="mini"><span class="n amber">' + tries + '</span><span class="l">Answers given</span></div>' +
      '</div></div>' +
      '<div class="section-h"><h2>Accuracy by topic</h2></div>' +
      CATS.map(function (c) {
        var ids = idsCat(c);
        var a = ids.filter(function (i) { return isSeen(i); }).length;
        var g = ids.filter(function (i) { return isMastered(i); }).length;
        var p = pct(g, ids.length);
        return '<button class="listrow" data-act="start" data-kind="cat" data-arg="' + esc(c) + '">' +
          '<div style="flex:1;min-width:0"><div class="lr-name">' + esc(c) + '</div>' +
          '<div class="lr-sub">' + g + ' right · ' + (a - g) + ' wrong · ' + (ids.length - a) + ' untouched</div>' +
          '<div class="bar"><span class="' + (p >= 80 ? 'ok' : p >= 40 ? 'amber' : 'bad') + '" style="width:' + p + '%"></span></div></div>' +
          '<span class="chev">' + ICON.chev + '</span></button>';
      }).join('') +
      '<div class="section-h"><h2>Session history</h2><span class="count">' + progress.tests.length + ' saved</span></div>' +
      (progress.tests.length
        ? progress.tests.map(function (t) {
          var p = pct(t.correct, t.total);
          return '<div class="listrow" style="cursor:default"><div style="flex:1;min-width:0">' +
            '<div class="lr-name">' + esc(t.title) + (t.mode === 'test' ? ' · mock' : '') + '</div>' +
            '<div class="lr-sub">' + fmtDate(t.at) + ' · ' + clock(t.dur) + '</div></div>' +
            '<div style="text-align:right"><div class="lr-name" style="color:' + (p >= PASS_PCT ? 'var(--ok)' : p >= 60 ? 'var(--amber)' : 'var(--alert)') + '">' + p + '%</div>' +
            '<div class="lr-sub">' + t.correct + '/' + t.total + '</div></div></div>';
        }).join('')
        : '<div class="empty">' + ICON.inbox + '<h3>No sessions yet</h3><p>Finish a practice run or a mock test and it shows up here.</p>' +
        '<button class="btn btn-primary" data-act="start" data-kind="mock">Take a mock test</button></div>') +
      '</div></main>';
  }

  /* ============================ VIEW: SETTINGS ============================ */
  function viewSettings() {
    function sw(key, title, sub) {
      return '<div class="setrow"><div style="flex:1"><div class="st">' + esc(title) + '</div><div class="ss">' + esc(sub) + '</div></div>' +
        '<button class="switch" role="switch" aria-checked="' + (settings[key] ? 'true' : 'false') + '" aria-label="' + esc(title) + '" data-act="toggle" data-arg="' + key + '"></button></div>';
    }
    var themeLabel = settings.theme === 'auto' ? 'Match my device' : (settings.theme === 'dark' ? 'Always dark' : 'Always light');
    return topbar({ back: 'home', title: 'Settings', right: themeBtn() }) +
      '<main class="app-main" id="main"><div class="wrap" style="padding-top:18px">' +
      '<div class="card card-pad">' +
      '<div class="setrow"><div style="flex:1"><div class="st">Appearance</div><div class="ss">' + themeLabel + '</div></div>' +
      '<button class="btn btn-ghost" data-act="cycletheme">Change</button></div>' +
      sw('shuffleQ', 'Shuffle question order', 'Random order for topic and mistake practice') +
      sw('shuffleOpts', 'Shuffle answer options', 'Stops you memorising “it is always C”') +
      sw('autoNext', 'Auto-advance after a correct answer', 'Moves on by itself when you get it right') +
      '</div>' +
      '<div class="section-h"><h2>Your data</h2></div>' +
      '<div class="card card-pad stack">' +
      '<div class="ss">Progress, bookmarks and history live in this browser only. Nothing is uploaded.</div>' +
      '<button class="btn btn-ghost btn-block" data-act="resetbm">Clear bookmarks (' + idsBookmarked().length + ')</button>' +
      '<button class="btn btn-danger btn-block" data-act="resetall">Reset all progress</button>' +
      '</div>' +
      '<p class="foot">Built from <span class="mono">EMT-CT &amp; MOCT Medical/Trauma Question Bank 2017 v1</span> · 346 questions.<br>Answers follow the options marked in that document.</p>' +
      '</div></main>';
  }

  /* ============================ EVENTS ============================ */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act');
    var arg = t.getAttribute('data-arg');
    var kind = t.getAttribute('data-kind');

    // modal
    if (act === 'modal-close') { if (ev.target === t) closeModal(); return; }
    if (act === 'modal-action') {
      var a = modalActions[+t.getAttribute('data-i')];
      closeModal();
      if (a && a.fn) a.fn();
      return;
    }

    switch (act) {
      case 'go': go(t.getAttribute('data-view')); break;
      case 'home': go('home'); break;
      case 'theme':
        settings.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
        saveSettings(); applyTheme(); render(); break;
      case 'cycletheme':
        settings.theme = settings.theme === 'auto' ? 'light' : (settings.theme === 'light' ? 'dark' : 'auto');
        saveSettings(); applyTheme(); render(); break;
      case 'start':
        if (t.disabled) return;
        startKind(kind, arg); break;
      case 'resume': {
        var s = loadSession();
        if (!s) { go('home'); break; }
        session = s;
        if (session.endsAt && session.endsAt <= Date.now()) { finishSession(); break; }
        go('runner');
        break;
      }
      case 'discard':
        openModal({
          title: 'Discard this session?', body: 'Your unfinished questions will be dropped. Answers you already gave are kept in your stats.',
          actions: [
            { label: 'Discard it', kind: 'btn-danger', fn: function () { store.del(K.sess); session = null; go('home'); } },
            { label: 'Keep it', kind: 'btn-ghost', fn: function () { } }
          ]
        });
        break;
      case 'pick': pickAnswer(+t.getAttribute('data-i')); break;
      case 'next':
        if (session.idx < session.items.length - 1) { session.idx++; saveSession(); renderRunner(); }
        break;
      case 'prev':
        if (session.idx > 0) { session.idx--; saveSession(); renderRunner(); }
        break;
      case 'jump':
        session.idx = +t.getAttribute('data-i'); saveSession(); closeModal(); renderRunner(); break;
      case 'navsheet': navSheet(); break;
      case 'flag':
        if (session.flags[session.idx]) delete session.flags[session.idx]; else session.flags[session.idx] = 1;
        saveSession(); renderRunner(true); break;
      case 'bookmark': {
        var id = curQ().id;
        if (bookmarks[id]) delete bookmarks[id]; else bookmarks[id] = 1;
        saveBookmarks(); renderRunner(true); break;
      }
      case 'bmtoggle': {
        var bid = t.getAttribute('data-id');
        if (bookmarks[bid]) delete bookmarks[bid]; else bookmarks[bid] = 1;
        saveBookmarks();
        var l = document.getElementById('browselist');
        if (l) l.innerHTML = browseListHTML();
        break;
      }
      case 'submit': {
        var missing = session.items.length - answeredCount();
        if (missing > 0) {
          openModal({
            title: missing + ' question' + (missing === 1 ? '' : 's') + ' still blank',
            body: session.mode === 'test' ? 'Blank answers count as wrong. Submit anyway?' : 'Finish anyway?',
            actions: [
              { label: 'Go back and answer', kind: 'btn-primary', fn: function () { } },
              { label: 'Submit now', kind: 'btn-ghost', fn: finishSession }
            ]
          });
        } else finishSession();
        break;
      }
      case 'quit':
        if (!session || session.finished) { go('home'); break; }
        openModal({
          title: 'Leave this session?', body: 'It is saved — you can resume from the home screen.',
          actions: [
            { label: 'Leave', kind: 'btn-ghost', fn: function () { saveSession(); go('home'); } },
            { label: 'Stay here', kind: 'btn-primary', fn: function () { } }
          ]
        });
        break;
      case 'retrywrong': {
        var ids = session.items.filter(function (it, i) {
          var a = session.answers[i]; return a == null || a !== BY_ID[it.id].ans;
        }).map(function (it) { return it.id; });
        if (!ids.length) { go('home'); break; }
        startSession({ ids: ids, mode: 'practice', title: 'Retry: ' + session.title, subtitle: 'Questions you missed' });
        break;
      }
      case 'again': {
        var again = session.items.map(function (it) { return it.id; });
        startSession({
          ids: again, mode: session.mode, title: session.title, subtitle: session.subtitle,
          limitSec: session.limitSec, shuffleQ: session.mode === 'test'
        });
        break;
      }
      case 'filter': browseState.filter = arg; browseState.limit = 30; render(); break;
      case 'catfilter': browseState.cat = arg; browseState.limit = 30; render(); break;
      case 'loadmore': {
        browseState.limit += 30;
        var ll = document.getElementById('browselist');
        if (ll) ll.innerHTML = browseListHTML();
        break;
      }
      case 'toggleans': browseState.showAns = !browseState.showAns; render(); break;
      case 'clearsearch': browseState.q = ''; browseState.limit = 30; render(); break;
      case 'clearfilters': browseState.q = ''; browseState.filter = 'all'; browseState.cat = 'all'; browseState.limit = 30; render(); break;
      case 'toggle':
        settings[arg] = !settings[arg]; saveSettings(); render(); break;
      case 'resetbm':
        openModal({
          title: 'Clear all bookmarks?', body: 'This removes every saved question.',
          actions: [
            { label: 'Clear them', kind: 'btn-danger', fn: function () { bookmarks = {}; saveBookmarks(); render(); } },
            { label: 'Cancel', kind: 'btn-ghost', fn: function () { } }
          ]
        });
        break;
      case 'resetall':
        openModal({
          title: 'Reset all progress?', body: 'Scores, history and per-question results are deleted. Bookmarks stay.',
          actions: [
            { label: 'Reset everything', kind: 'btn-danger', fn: function () { progress = { byId: {}, tests: [] }; saveProgress(); store.del(K.sess); session = null; go('home'); } },
            { label: 'Cancel', kind: 'btn-ghost', fn: function () { } }
          ]
        });
        break;
    }
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (modalOpen) { if (e.key === 'Escape') closeModal(); return; }
    if (view !== 'runner' || !session || session.finished) return;
    var k = e.key;
    if (k >= '1' && k <= '4') {
      e.preventDefault(); pickAnswer(+k - 1); return;
    }
    var lower = k.toLowerCase();
    if (lower === 'a' || lower === 'b' || lower === 'c' || lower === 'd') {
      e.preventDefault(); pickAnswer(LETTERS.indexOf(lower.toUpperCase())); return;
    }
    if (k === 'ArrowRight') { e.preventDefault(); if (session.idx < session.items.length - 1) { session.idx++; saveSession(); renderRunner(); } return; }
    if (k === 'ArrowLeft') { e.preventDefault(); if (session.idx > 0) { session.idx--; saveSession(); renderRunner(); } return; }
    if (k === 'Enter') {
      e.preventDefault();
      if (session.idx < session.items.length - 1) { session.idx++; saveSession(); renderRunner(); }
      else {
        var missing = session.items.length - answeredCount();
        if (missing > 0) {
          openModal({
            title: missing + ' question' + (missing === 1 ? '' : 's') + ' still blank',
            body: 'Finish anyway?',
            actions: [{ label: 'Go back', kind: 'btn-primary', fn: function () { } }, { label: 'Finish now', kind: 'btn-ghost', fn: finishSession }]
          });
        } else finishSession();
      }
      return;
    }
    if (lower === 'f' && session.mode === 'test') {
      e.preventDefault();
      if (session.flags[session.idx]) delete session.flags[session.idx]; else session.flags[session.idx] = 1;
      saveSession(); renderRunner(true); return;
    }
    if (lower === 's') {
      e.preventDefault();
      var id = curQ().id;
      if (bookmarks[id]) delete bookmarks[id]; else bookmarks[id] = 1;
      saveBookmarks(); renderRunner(true);
    }
  });

  window.addEventListener('beforeunload', function () { if (session && !session.finished) saveSession(); });

  /* ============================ BOOT ============================ */
  render();
  window.EMT = { QS: QS, store: store, state: function () { return { view: view, session: session }; } };
})();

</script>
</body>
</html>
